<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A troca das fechaduras · DidatiClick</title>
<link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/fin.css">
<script src="../assets/desafio.js"></script><script src="../assets/fin.js"></script><script src="../assets/ass.js?v=1"></script>
</head>
<body>
<header><div class="brand">Didati<b>Click</b> · A Matemática de um Assalto</div><h1>A troca das fechaduras</h1></header>
<main>
<div class="card"><h2>Técnicos, fechaduras e dias</h2><p class="muted" style="margin-top:0">Cada técnico troca <b>2 fechaduras por dia</b>. Mude o número de técnicos e de fechaduras e veja o calendário.</p>
<div class="fig" id="fig"></div>
<div class="sl" id="st"><b>Técnicos</b><input type="range"><span></span></div>
<div class="sl" id="sf"><b>Fechaduras</b><input type="range"><span></span></div>
<div class="kpi"><div class="o">Dias<b id="kd"></b></div><div>Fechaduras por dia<b id="kp"></b></div><div>Conta<b id="kc"></b></div></div>
<div id="m"></div></div>
</main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
(()=>{
const OURO='#E3A72F',PRATA='#AEB7C6';
const mdc=(a,b)=>b?mdc(b,a%b):a;
const R$s=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
const barra=(x,y,w,h,c)=>`<polygon points="${x},${y+h} ${x+w},${y+h} ${x+w*.82},${y} ${x+w*.18},${y}" fill="${c}" stroke="${NAVY}" stroke-width=".8"/>`;
function maxde(id,m){$(id).querySelector('input').max=m;}
const Tc=SL('st',1,12,1,2,draw),Fc=SL('sf',8,120,4,24,draw);
const d_=()=>Fc.get()/(2*Tc.get());
MIS.def(()=>[
 ['Com <b>4 técnicos</b> e <b>40 fechaduras</b>, quantos dias?',()=>Tc.get()==4&&Fc.get()==40,'40 ÷ (4 · 2) = 5 dias, como Lara calculou.',()=>'Ajuste 4 técnicos e 40 fechaduras.'],
 ['Mantenha as 40 fechaduras e <b>dobre os técnicos</b>. O que acontece com os dias?',()=>Tc.get()==8&&Fc.get()==40,'5 dias viram 2,5: dobrou um, o outro caiu pela metade. Proporção inversa.',()=>Fc.get()!=40?'Volte para 40 fechaduras.':'Dobre os 4 técnicos.'],
 ['Quantos técnicos trocam <b>60 fechaduras em 3 dias</b>?',()=>Fc.get()==60&&Tc.get()==10,'60 ÷ 3 = 20 por dia; 20 ÷ 2 = 10 técnicos.',()=>Fc.get()!=60?'Ponha 60 fechaduras.':'Agora: '+r1(d_())+' dias. Queremos 3.'],
 ['Com <b>6 técnicos</b>, quantas fechaduras dá para trocar em <b>4 dias</b>?',()=>Tc.get()==6&&Fc.get()==48,'6 · 2 · 4 = 48. Mesmos técnicos: fechaduras e dias são diretamente proporcionais.',()=>Tc.get()!=6?'Use 6 técnicos.':'Agora: '+r1(d_())+' dias. Queremos 4.']]);
function draw(){const t=Tc.get(),f=Fc.get(),d=d_();let g='';
 for(let i=0;i<t;i++){const x=20+(i%6)*30,y=60+Math.floor(i/6)*60;g+=`<circle cx="${x+10}" cy="${y-30}" r="7" fill="${NAVY}"/>`+RC(x+3,y-22,14,20,NAVY,'rx="4"')+RC(x+16,y-14,8,4,ORANGE);}
 g+=TX(100,150,t+' técnico'+(t>1?'s':''),{fs:11});
 const dc=Math.ceil(d);for(let i=0;i<Math.max(dc,1);i++){const x=220+(i%10)*24,y=20+Math.floor(i/10)*30;const fr=Math.min(1,d-i);
  g+=RC(x,y,20,24,'#EEF2F8','rx="3" stroke="#D7DEEA"')+RC(x,y,20*fr,24,ORANGE,'rx="3"')+TX(x+10,y+16,String(i+1),{fs:9,c:fr>.5?'#fff':NAVY});}
 const fy=Math.min(200,30+Math.ceil(Math.max(dc,1)/10)*30+20);
 g+=TX(340,fy,r1(d)+' dia'+(d==1?'':'s')+' de trabalho',{fs:12,c:ORANGE});
 $('fig').innerHTML=SVG(470,Math.max(170,fy+14),g);
 $('kd').textContent=r1(d);$('kp').textContent=2*t;$('kc').innerHTML=f+' ÷ ('+t+' · 2)';
 MIS.ver('m');}
draw();
})();
</script>
</body>
</html>
