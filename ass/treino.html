<header><div class="brand">Didati<b>Click</b> · A Matemática de um Assalto</div><h1>Pratique</h1></header>
<main>

<div class="card"><h2 id="mt">Exercícios sorteados</h2><p class="muted" style="margin-top:0">Cada vez que você aperta <b>Outro exercício</b>, um problema novo é sorteado. Responda, confira e veja a explicação.</p>

<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
(()=>{
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const LIV={'ass1':{T:["A planta do banco", "Escala e medidas reais", "Perímetro e área das salas", "Ângulos e campo de visão", "Pitágoras e o atalho", "Semelhança: a altura do prédio"],G:{1:()=>{const t=R(0,2);
 if(t==0){const x1=R(0,10),x2=x1+R(2,12),y=R(0,16);return{q:`Os pontos <b>(${x1}, ${y})</b> e <b>(${x2}, ${y})</b> estão na mesma horizontal. Qual a distância entre eles, em metros?`,a:x2-x1,exp:`Mesmo y: ${x2} − ${x1} = ${x2-x1} m.`};}
 if(t==1){const x=R(0,20),y=R(0,12),dx=R(1,4),dy=R(1,4);return{q:`Lara parte de <b>(${x}, ${y})</b>, anda <b>${dx} m</b> para a direita e <b>${dy} m</b> para cima. Qual o novo x? (o novo y será ${y+dy})`,a:x+dx,exp:`(${x} + ${dx}, ${y} + ${dy}) = (${x+dx}, ${y+dy}).`};}
 const a=R(0,8),b=R(0,8),w=R(3,10),h=R(2,8);return{q:`Uma sala vai de <b>(${a}, ${b})</b> a <b>(${a+w}, ${b+h})</b>. Quanto mede a largura (na horizontal)?`,a:w,exp:`${a+w} − ${a} = ${w} m (e a altura é ${b+h} − ${b} = ${h} m).`};},
2:()=>{const t=R(0,2),e=P([50,100,200,250,500]);
 if(t==0){const c=P([2,3,4,5,6,8,12]);return{q:`Na escala <b>1 : ${e}</b>, quanto vale na realidade uma medida de <b>${c} cm</b> no papel, em metros?`,a:c*e/100,tol:.001,exp:`${c} · ${e} = ${c*e} cm = ${fmt(c*e/100)} m.`};}
 if(t==1){const m=P([4,8,10,12,20,24,30]);return{q:`Um corredor de <b>${m} m</b> vai ser desenhado na escala <b>1 : ${e}</b>. Quantos centímetros ele terá no papel?`,a:m*100/e,tol:.001,exp:`${m} m = ${m*100} cm; ${m*100} ÷ ${e} = ${fmt(m*100/e)} cm.`};}
 const c=P([2,4,5]),m=c*e/100;return{q:`Um corredor de <b>${fmt(m)} m</b> foi desenhado com <b>${c} cm</b>. A escala é 1 : ? (escreva o número)`,a:e,exp:`${c} cm : ${fmt(m*100)} cm = 1 : ${e}.`};},
3:()=>{const t=R(0,2);
 if(t==0){const a=R(3,15),b=R(2,12);return{q:`Qual o perímetro de uma sala de <b>${a} m × ${b} m</b>?`,a:2*(a+b),exp:`2 · ${a} + 2 · ${b} = ${2*(a+b)} m.`};}
 if(t==1){const a=R(3,15),b=R(2,12);return{q:`Qual a área de uma sala de <b>${a} m × ${b} m</b>, em m²?`,a:a*b,exp:`${a} · ${b} = ${a*b} m².`};}
 const p=P([20,24,28,32,40]),a=R(2,p/2-2);return{q:`Um retângulo tem perímetro <b>${p} m</b> e um lado de <b>${a} m</b>. Qual a área, em m²?`,a:a*(p/2-a),exp:`Outro lado: ${p/2} − ${a} = ${p/2-a}; área ${a} · ${p/2-a} = ${a*(p/2-a)} m².`};},
4:()=>{const t=R(0,3);
 if(t==0){const x=R(5,85);return{q:`Qual o <b>complemento</b> de ${x}°?`,a:90-x,exp:`90 − ${x} = ${90-x}°.`};}
 if(t==1){const x=R(5,175);return{q:`Qual o <b>suplemento</b> de ${x}°?`,a:180-x,exp:`180 − ${x} = ${180-x}°.`};}
 if(t==2){const a=R(20,80),b=R(20,80);return{q:`Um triângulo tem ângulos de <b>${a}°</b> e <b>${b}°</b>. Quanto mede o terceiro?`,a:180-a-b,exp:`180 − ${a} − ${b} = ${180-a-b}°.`};}
 const x=P([30,45,60,90,100,120,150]);return{q:`Um ângulo de <b>${x}°</b> é:`,opts:['agudo','reto','obtuso'],a:x<90?'agudo':x==90?'reto':'obtuso',exp:'Agudo: menor que 90°. Reto: 90°. Obtuso: entre 90° e 180°.'};},
5:()=>{const t=R(0,2),[a,b,c]=P([[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[12,16,20],[7,24,25]]);
 if(t==0)return{q:`Os catetos medem <b>${a} m</b> e <b>${b} m</b>. Quanto mede a hipotenusa?`,a:c,exp:`√(${a*a} + ${b*b}) = √${c*c} = ${c} m.`};
 if(t==1)return{q:`A hipotenusa mede <b>${c} m</b> e um cateto, <b>${a} m</b>. Quanto mede o outro cateto?`,a:b,exp:`√(${c*c} − ${a*a}) = √${b*b} = ${b} m.`};
 const x=R(2,9),y=R(2,9),d=Math.round(Math.hypot(x,y)*10)/10;return{q:`Qual a diagonal de uma sala de <b>${x} m × ${y} m</b>? (1 casa decimal)`,a:d,tol:.06,exp:`√(${x*x} + ${y*y}) = √${x*x+y*y} ≈ ${fmt(d)} m.`};},
6:()=>{const t=R(0,2);
 if(t==0){const [h,s]=P([[1.5,2],[1,0.8],[2,3],[1.6,2],[1,1.25]]),S=P([4,8,10,12,16,20]);return{q:`Um bastão de <b>${fmt(h)} m</b> faz sombra de <b>${fmt(s)} m</b>. No mesmo instante, um prédio faz sombra de <b>${S} m</b>. Qual a altura do prédio, em m? (até 2 casas)`,a:Math.round(h/s*S*100)/100,tol:.011,exp:`h = ${S} · ${fmt(h)} ÷ ${fmt(s)} ≈ ${fmt(Math.round(h/s*S*100)/100)} m.`};}
 if(t==1){const k=P([2,3,4,5]);return{q:`Os lados de uma figura foram multiplicados por <b>${k}</b>. A área fica quantas vezes maior?`,a:k*k,exp:`A área multiplica por k² = ${k*k}.`};}
 const [a,b,c]=P([[3,4,5],[5,12,13],[6,8,10]]),k=P([2,3,4]);return{q:`Um triângulo de lados ${a}, ${b} e ${c} é semelhante a outro cujo menor lado mede <b>${a*k}</b>. Quanto mede o maior lado do outro?`,a:c*k,exp:`Razão ${k}: ${c} · ${k} = ${c*k}.`};}}},'ass2':{T:["Anotar tudo", "Gráficos da rotina", "A média da ronda", "Mediana e moda", "O quanto varia", "Quem está no banco: diagramas de Venn", "A janela de oportunidade"],G:{1:()=>{const t=R(0,2);
 if(t==0){const n=P([20,40,50,80,100,200,250]),k=P([5,10,20,25,40,50]);const a=n*k/100;return{q:`De <b>${n}</b> visitantes, <b>${a}</b> eram entregadores. Qual a frequência relativa, em %?`,a:k,exp:`${a} ÷ ${n} = ${fmt(k/100)} = ${k}%.`};}
 if(t==1){const n=P([40,60,80,120,150,200]),k=P([10,15,20,25,30,45,60]);return{q:`Em <b>${n}</b> visitantes, <b>${k}%</b> eram clientes. Quantos clientes foram?`,a:n*k/100,tol:.001,exp:`${k}% de ${n} = ${fmt(k/100)} · ${n} = ${fmt(n*k/100)}.`};}
 const v=P(['a cor do carro-forte','o número de pessoas na fila','a duração de uma ronda','o tipo de visitante','a altura de um funcionário','o dia da semana']),q=['o número de pessoas na fila','a duração de uma ronda','a altura de um funcionário'].includes(v);
 return{q:`A variável <b>${v}</b> é:`,opts:['qualitativa','quantitativa'],a:q?'quantitativa':'qualitativa',exp:'Quantitativa: a resposta é um número que se mede ou conta. Qualitativa: a resposta é uma categoria.'};},
2:()=>{const t=R(0,2);
 if(t==0){const k=P([10,20,25,30,40,50,75]);return{q:`Num gráfico de setores, uma fatia representa <b>${k}%</b> do total. Quantos graus tem essa fatia?`,a:3.6*k,tol:.001,exp:`${k}% de 360° = ${fmt(3.6*k)}°.`};}
 if(t==1){const a=P([20,30,40,50]),b=a+P([2,3,4,5]),e=a-P([1,2]);const ap=(b-e)/(a-e);return{q:`Duas colunas valem <b>${a}</b> e <b>${b}</b>, mas o eixo começa em <b>${e}</b>. Quantas vezes a segunda <b>parece</b> maior? (1 casa)`,a:Math.round(ap*10)/10,tol:.06,exp:`Alturas desenhadas: ${b} − ${e} = ${b-e} e ${a} − ${e} = ${a-e}; ${b-e} ÷ ${a-e} ≈ ${fmt(Math.round(ap*10)/10)}.`};}
 const s=P([['a variação da temperatura ao longo do dia','linhas'],['as partes de um orçamento (100%)','setores'],['comparar o número de clientes de 5 agências','colunas'],['a evolução do saldo mês a mês','linhas'],['a divisão dos visitantes por tipo','setores']]);
 return{q:`Qual o gráfico mais indicado para mostrar <b>${s[0]}</b>?`,opts:['colunas','linhas','setores'],a:s[1],exp:'Colunas comparam categorias; linhas mostram variação no tempo; setores mostram partes de um todo.'};},
3:()=>{const t=R(0,2);
 if(t==0){const m=R(8,15),d=[R(-3,3),R(-3,3),R(-3,3),R(-3,3)];d.push(-d.reduce((a,b)=>a+b,0));const v=d.map(x=>m+x);return{q:`Calcule a média das rondas: <b>${v.join(', ')}</b> minutos.`,a:m,exp:`Soma ${5*m} ÷ 5 = ${m}.`};}
 if(t==1){const n=P([4,5,6]),m=R(10,20),s=n*m,a=R(m-6,m+6);return{q:`A média de <b>${n}</b> rondas foi <b>${m} min</b>. Uma delas durou ${a} min. Quanto somam as outras ${n-1}?`,a:s-a,exp:`Soma total ${n} · ${m} = ${s}; ${s} − ${a} = ${s-a}.`};}
 const a=R(5,9),b=R(6,10),pa=P([1,2,3]),pb=P([1,2,3]);const m=(a*pa+b*pb)/(pa+pb);return{q:`Nota <b>${a}</b> com peso <b>${pa}</b> e nota <b>${b}</b> com peso <b>${pb}</b>. Qual a média ponderada? (2 casas)`,a:Math.round(m*100)/100,tol:.011,exp:`(${a}·${pa} + ${b}·${pb}) ÷ ${pa+pb} = ${a*pa+b*pb} ÷ ${pa+pb} ≈ ${fmt(Math.round(m*100)/100)}.`};},
4:()=>{const t=R(0,2);
 if(t==0){const v=[R(1,20),R(1,20),R(1,20),R(1,20),R(1,20)];const s=[...v].sort((a,b)=>a-b);return{q:`Qual a mediana de <b>${v.join(', ')}</b>?`,a:s[2],exp:`Em ordem: ${s.join(', ')}. O do meio é ${s[2]}.`};}
 if(t==1){const v=[R(1,20),R(1,20),R(1,20),R(1,20),R(1,20),R(1,20)];const s=[...v].sort((a,b)=>a-b),md=(s[2]+s[3])/2;return{q:`Qual a mediana de <b>${v.join(', ')}</b>?`,a:md,exp:`Em ordem: ${s.join(', ')}. Média dos dois do meio: (${s[2]} + ${s[3]}) ÷ 2 = ${fmt(md)}.`};}
 const m=R(2,15),o=[R(1,20),R(1,20),R(1,20)].filter(x=>x!=m);const v=[m,m,m,...o].sort(()=>Math.random()-.5);return{q:`Qual a moda de <b>${v.join(', ')}</b>?`,a:m,exp:`${m} aparece ${v.filter(x=>x==m).length} vezes, mais que qualquer outro.`};},
5:()=>{const t=R(0,2);
 if(t==0){const v=[R(5,20),R(5,20),R(5,20),R(5,20),R(5,20)];return{q:`Qual a amplitude de <b>${v.join(', ')}</b>?`,a:Math.max(...v)-Math.min(...v),exp:`${Math.max(...v)} − ${Math.min(...v)} = ${Math.max(...v)-Math.min(...v)}.`};}
 const S=P([[[2,4,6],2],[[1,3,5,7],4],[[2,6],1],[[3,5,7],2],[[4,8],1],[[0,2,4,6,8],4]]),m=R(8,14),v=S[0].map(x=>x-S[0][0]+m-(S[0][S[0].length-1]-S[0][0])/2);
 const dm=v.reduce((a,x)=>a+Math.abs(x-m),0)/v.length,va=v.reduce((a,x)=>a+(x-m)**2,0)/v.length;
 if(t==1)return{q:`Os valores <b>${v.join(', ')}</b> têm média ${m}. Qual o desvio médio? (2 casas)`,a:Math.round(dm*100)/100,tol:.011,exp:`Distâncias até ${m}: ${v.map(x=>Math.abs(x-m)).join(', ')}; média = ${fmt(Math.round(dm*100)/100)}.`};
 return{q:`Os valores <b>${v.join(', ')}</b> têm média ${m}. Qual a variância? (2 casas)`,a:Math.round(va*100)/100,tol:.011,exp:`Quadrados dos desvios: ${v.map(x=>(x-m)**2).join(', ')}; média = ${fmt(Math.round(va*100)/100)} (desvio padrão ≈ ${fmt(Math.round(Math.sqrt(va)*100)/100)}).`};},
6:()=>{const t=R(0,2),a=R(6,20),b=R(4,15),i=R(1,Math.min(a,b)-1),u=a+b-i+R(0,8);
 if(t==0)return{q:`n(A) = <b>${a}</b>, n(B) = <b>${b}</b> e n(A ∩ B) = <b>${i}</b>. Quanto vale n(A ∪ B)?`,a:a+b-i,exp:`${a} + ${b} − ${i} = ${a+b-i}.`};
 if(t==1)return{q:`Dos <b>${u}</b> funcionários, <b>${a}</b> trabalham de manhã, <b>${b}</b> no sábado e <b>${i}</b> nos dois. Quantos não estão em nenhum dos dois?`,a:u-(a+b-i),exp:`União: ${a} + ${b} − ${i} = ${a+b-i}; ${u} − ${a+b-i} = ${u-(a+b-i)}.`};
 return{q:`n(A) = <b>${a}</b> e n(A ∩ B) = <b>${i}</b>. Quantos elementos há em <b>A − B</b> (só em A)?`,a:a-i,exp:`${a} − ${i} = ${a-i}.`};},
7:()=>{const t=R(0,2),f=[R(2,12),R(2,12),R(2,12),R(2,12),R(2,12)],tot=f.reduce((a,b)=>a+b,0);
 if(t==0){const k=R(2,4);return{q:`As frequências das classes são <b>${f.join(', ')}</b>. Qual a frequência acumulada até a ${k}ª classe?`,a:f.slice(0,k).reduce((a,b)=>a+b,0),exp:`${f.slice(0,k).join(' + ')} = ${f.slice(0,k).reduce((a,b)=>a+b,0)}.`};}
 if(t==1){const k=R(0,4),fr=Math.round(1000*f[k]/tot)/10;return{q:`As frequências das classes são <b>${f.join(', ')}</b> (total ${tot}). Qual a frequência relativa da classe com ${f[k]}, em %? (1 casa)`,a:fr,tol:.06,exp:`${f[k]} ÷ ${tot} ≈ ${fmt(fr)}%.`};}
 const mn=Math.min(...f),k=f.indexOf(mn),h=['14h00','14h10','14h20','14h30','14h40'];return{q:`Pessoas no saguão por intervalo de 10 min a partir das 14h00: <b>${f.join(', ')}</b>. Quantas pessoas há na janela mais calma?`,a:mn,exp:`O menor valor é ${mn}, no intervalo que começa às ${h[k]}.`};}}}};
const qs=new URLSearchParams(location.search);let l=qs.get('l');if(!LIV[l])l='ass1';const {T,G}=LIV[l];
let m=+(qs.get('m'))||1;if(!G[m])m=1;let cur,ok=0,tot=0,feito=false,esc=null;
function mods(){$('mods').innerHTML=T.map((t,i)=>`<button class="${i+1==m?'':'alt'}" style="padding:4px 10px;font-size:13px" title="${t}" data-m="${i+1}">${i+1}</button>`).join('');
 document.querySelectorAll('#mods button').forEach(b=>b.onclick=()=>{m=+b.dataset.m;history.replaceState(null,'','?l='+l+'&m='+m);mods();novo();});}
function novo(){cur=G[m]();feito=false;esc=null;$('mt').textContent='Módulo '+m+' · '+T[m-1];$('q').innerHTML=cur.q;$('fb').style.display='none';
 $('resp').innerHTML=cur.opts?cur.opts.map(o=>`<button class="alt opt" style="margin:3px">${o}</button>`).join(''):'<input type="text" inputmode="decimal" id="r" placeholder="sua resposta" style="font-size:16px;padding:8px;border:2px solid #D7DEEA;border-radius:10px;width:100%;box-sizing:border-box">';
 if(cur.opts)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{esc=b.textContent;document.querySelectorAll('.opt').forEach(x=>x.className='alt opt');b.className='opt';});
 else $('r').onkeydown=e=>{if(e.key=='Enter')conf();};}
function conf(){if(feito)return;let v=cur.opts?esc:($('r').value.trim());if(v===null||v==='')return;
 const certo=cur.opts?v==cur.a:Math.abs(+v.replace(',','.')-cur.a)<=(cur.tol||0.001);
 feito=true;tot++;if(certo)ok++;$('fb').style.display='block';$('fb').className='msg '+(certo?'ok':'bad');$('fb').innerHTML=(certo?'<b>Certo!</b> ':'<b>Ainda não.</b> A resposta é <b>'+(typeof cur.a=='number'?fmt(cur.a):cur.a)+'</b>. ')+cur.exp;
 $('placar').textContent=`Acertos nesta visita: ${ok} de ${tot}`;}
$('conf').onclick=conf;$('novo').onclick=novo;mods();novo();
})();
</script>
