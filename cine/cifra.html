<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Máquina de cifras · DidatiClick</title>
<link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/fin.css">
<script src="../assets/desafio.js"></script><script src="../assets/fin.js"></script><script src="../assets/cine.js"></script>
</head>
<body>
<header><div class="brand">Didati<b>Click</b> · Matemática e Cinema</div><h1>Máquina de cifras</h1></header>
<main>
<div class="card"><h2>Cifrar e decifrar</h2><div class="chips" id="tp"></div>
<div class="fig" id="ab"></div><p class="muted" id="abx" style="margin:4px 0 0"></p>
<textarea id="tx" rows="3" style="width:100%;font-family:inherit;font-size:16px;margin-top:10px;border:2px solid #D7DEEA;border-radius:10px;padding:8px">NOSSO FILME E FANTASTICO</textarea>
<div class="sl" id="k"><b>Chave de César</b><input type="range"><span></span></div>
<div id="vg" hidden><b style="color:var(--navy);font-size:14px">Palavra-chave de Vigenère</b><input id="pv" value="LUZ" style="width:100%;font-family:inherit;font-size:16px;border:2px solid #D7DEEA;border-radius:10px;padding:6px;margin:6px 0"></div>
<div class="row"><button id="cif" class="or">Cifrar</button><button id="dec">Decifrar</button></div>
<div class="card" style="background:var(--bg);font-family:monospace;font-size:17px;word-break:break-all;margin-top:10px" id="out"></div></div>
<div class="card"><h2>Quebre a cifra: contagem de letras</h2><p class="muted" style="margin-top:0">Frequência das letras do texto da caixa. Em português, o A costuma ser a mais comum.</p><div class="fig" id="fig"></div>
<div class="row"><button id="tenta" class="alt">Testar: a mais comum é o A</button></div></div>
</main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
const AL='ABCDEFGHIJKLMNOPQRSTUVWXYZ',tp=chips('tp',['César','Vigenère'],0,()=>{$('vg').hidden=tp.get()===0;$('k').hidden=tp.get()===1;alfa();}),K=SL('k',0,25,1,3,()=>alfa());
const limpa=s=>s.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function cesar(s,k){return limpa(s).replace(/[A-Z]/g,c=>AL[(AL.indexOf(c)+k+26)%26]);}
function vig(s,p,sg){p=limpa(p).replace(/[^A-Z]/g,'')||'A';let j=0;return limpa(s).replace(/[A-Z]/g,c=>AL[(AL.indexOf(c)+sg*AL.indexOf(p[j++%p.length])+26)%26]);}
function run(sg){const s=$('tx').value,r=tp.get()===0?cesar(s,sg*K.get()):vig(s,$('pv').value,sg);$('out').textContent=r;$('tx').value=r;freq();}
$('cif').onclick=()=>run(1);$('dec').onclick=()=>run(-1);
function freq(){const s=limpa($('tx').value).replace(/[^A-Z]/g,''),c=AL.split('').map(l=>s.split(l).length-1),mx=Math.max(1,...c);
 $('fig').innerHTML=SVG(338,120,c.map((v,i)=>`<rect x="${4+i*12.8}" y="${100-v/mx*85}" width="10" height="${v/mx*85}" fill="${v===mx&&v>0?ORANGE:NAVY}"/>`+TX(9+i*12.8,114,AL[i],{fs:8})).join(''));return c;}
$('tx').oninput=()=>{freq();alfa();};$('pv').oninput=()=>alfa();
function tira(y,k,rot,us){let g=TX(2,y+12,rot,{fs:10,a:'start'});for(let i=0;i<26;i++){const x=62+i*10.6,u=us.includes(AL[i]);
 g+=`<rect x="${x}" y="${y}" width="10" height="16" rx="2" fill="${u?ORANGE:'#E8EDF5'}"/>`+TX(x+5,y+12,AL[i],{fs:9,c:u?'#fff':NAVY});
 g+=`<line x1="${x+5}" y1="${y+17}" x2="${x+5}" y2="${y+25}" stroke="${u?ORANGE:GRAYL}"/>`;
 const c=AL[(i+k)%26];g+=`<rect x="${x}" y="${y+26}" width="10" height="16" rx="2" fill="${u?NAVY:'#fff'}" stroke="${NAVY}" stroke-width=".6"/>`+TX(x+5,y+38,c,{fs:9,c:u?'#fff':NAVY});}return g;}
function alfa(){const us=limpa($('tx').value).replace(/[^A-Z]/g,'');let g='',h;
 if(tp.get()===0){const k=K.get();g=tira(4,k,'normal',us)+TX(2,42,'cifrado',{fs:10,a:'start'});h=50;
  $('abx').textContent='Cada letra anda '+k+' casas: A vira '+AL[k%26]+', B vira '+AL[(1+k)%26]+'. As letras laranjas são as do seu texto.';}
 else{const p=(limpa($('pv').value).replace(/[^A-Z]/g,'')||'A').slice(0,4);h=0;
  for(let j=0;j<p.length;j++){const k=AL.indexOf(p[j]),u=us.split('').filter((c,i)=>i%p.length===j).join('');g+=tira(4+j*50,k,p[j]+' (+'+k+')',u);h+=50;}
  $('abx').textContent='Cada letra da palavra-chave é um César diferente. A 1ª letra do texto usa a régua '+p[0]+', a 2ª usa '+(p[1]||p[0])+', e assim por diante.';}
 $('ab').innerHTML=SVG(340,h,g);}
alfa();
$('tenta').onclick=()=>{const c=freq(),i=c.indexOf(Math.max(...c));$('out').textContent='A letra mais comum é '+AL[i]+'. Se ela for o A, a chave de César é '+i+'. Decifrando: '+cesar($('tx').value,-i);};
freq();$('out').textContent='Escreva um texto e toque em Cifrar.';
</script>
</body>
</html>
