const svg=(W,H,g)=>`<svg viewBox="0 0 ${W} ${H}" width="${W}">${g}</svg>`;

const s=v=>String(v).replace('-','−');
const B=D.sl('b',1,200,1,5,draw);
function draw(){const b=B.get(),a=Math.round(b*Math.SQRT2),q=a/b;
 $('rs').innerHTML=`<div>fração<b>${a}/${b}</b></div><div>(a/b)²<b>${(q*q).toFixed(6).replace('.',',')}</b></div><div>a² e 2b²<b>${fmt(a*a)} e ${fmt(2*b*b)}</b></div>`;
 $('nt').innerHTML=`${a}² = ${fmt(a*a)} e 2 × ${b}² = ${fmt(2*b*b)}: ${Math.abs(a*a-2*b*b)===1?'erram por 1 só! Uma fração excelente, mas ainda não é √2.':'não são iguais.'} Em a², cada fator primo aparece um número par de vezes; em 2b², o fator 2 aparece um número ímpar de vezes. Por isso <b>nunca</b> serão iguais.`;}draw();
