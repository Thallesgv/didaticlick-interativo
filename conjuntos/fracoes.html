<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barras de frações · DidatiClick</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
svg.fig{width:100%;height:auto;display:block;touch-action:manipulation}
.sl{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:8px;margin:6px 0}
.sl b{color:var(--navy);font-size:14px}.sl span{font-weight:700;color:var(--orange);text-align:right}
.res{font-size:18px;margin:6px 0;color:var(--navy);font-weight:600}
.big{font-size:22px;font-weight:700;color:var(--navy);text-align:center;margin:4px 0}
input.num,select{font-family:inherit;font-size:17px;padding:8px 10px;border:2px solid #D7DEEA;border-radius:10px;width:100%;color:var(--navy);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lbl{font-size:13px;color:var(--gray);margin:0 0 2px}
.log{list-style:none;padding:0;margin:6px 0 0}
.log li{padding:6px 0;border-bottom:1px dashed #D7DEEA;font-size:15px}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:600}
.tag.ok{background:#DCFCE7;color:var(--ok)}.tag.bad{background:#FEE2E2;color:var(--bad)}.tag.info{background:#EEF3FF;color:var(--blue)}
.cj{font-family:'DejaVu Serif',Georgia,serif;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:#fff;color:var(--navy);border:2px solid #D7DEEA;font-weight:600}
.chips button.sel{border-color:var(--orange);background:#FFF3E6}
</style>
</head>
<body>
<header><div class="brand">Didati<b>Click</b> · Conjuntos numéricos</div><h1 id="title">Barras de frações</h1></header>
<main>

<div class="card"><p class="muted" id="lead" style="margin:0 0 6px"></p><svg class="fig" id="svg" viewBox="0 0 340 200"></svg><div class="eq" id="eq"></div><div id="msg"></div>
<div class="row" id="btns" style="margin-top:8px"></div></div>
<div class="card" id="ctl"></div>
<div class="card"><h2>Repare</h2><p style="margin:0" id="obs"></p></div>
</main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
const q=new URLSearchParams(location.search);const $=i=>document.getElementById(i);
const P=(k,d,lo,hi)=>{let v=parseInt(q.get(k));if(isNaN(v))v=d;return Math.max(lo,Math.min(hi,v));};
const fmt=n=>n.toLocaleString('pt-BR');
const NAVY='#0E2354',OR='#F7821F',BL='#2457D6',GR='#15803D',RD='#B91C1C',GY='#6B7280',PU='#7A4BB5';
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||13}" font-weight="${o.w||700}" fill="${o.c||NAVY}" text-anchor="${o.a||'middle'}" font-family="${o.f||'Poppins,sans-serif'}">${s}</text>`;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const F=(p,q2=1)=>{if(q2<0){p=-p;q2=-q2;}const g=gcd(p,q2);return [p/g,q2/g];};
const fs=f=>(f[1]===1?String(f[0]):f[0]+'/'+f[1]).replace(/-/g,'−');

const modo=q.get('modo')||'equiv';let cut=false;
const pf=s=>{const m=(s||'').replace('−','-').match(/^(-?\d+)\/(\d+)$/);return m?[+m[1],+m[2]]:null;};
const A=pf(q.get('a'))||[1,2],B=pf(q.get('b'))||[1,3];
const sl=(id,l,mn,mx,v)=>`<div class="sl"><b>${l}</b><input type="range" id="${id}" min="${mn}" max="${mx}" value="${v}"><span id="${id}v"></span></div>`;
const TT={equiv:'Frações equivalentes',soma:'Somar e subtrair frações',mult:'Multiplicar frações: modelo de área'};$('title').textContent=TT[modo]||TT.equiv;document.title=$('title').textContent+' · DidatiClick';
if(modo==='equiv'){$('ctl').innerHTML='<h2>Mexa</h2>'+sl('n','numerador',0,12,P('n',3,0,12))+sl('d','denominador',1,12,P('d',4,1,12))+sl('k','cortar cada parte em',1,6,2);
 $('lead').textContent='A barra de cima mostra a fração. Na de baixo, cada parte foi cortada em pedaços menores. A parte pintada é a mesma?';
 $('obs').textContent='Cortar cada parte em k pedaços multiplica o numerador e o denominador por k: a fração muda de nome, mas a quantidade pintada é a mesma. Por isso 3/4 = 6/8 = 9/12 ocupam o mesmo ponto da reta.';}
if(modo==='soma'){$('ctl').innerHTML='<h2>Escolha as frações</h2>'+sl('n1','1ª: numerador',0,12,A[0])+sl('d1','1ª: denominador',1,12,A[1])+sl('n2','2ª: numerador',0,12,B[0])+sl('d2','2ª: denominador',1,12,B[1])+'<div class="row"><button class="alt" id="tg">Trocar para subtração</button></div>';
 $('lead').textContent='As partes das duas barras têm tamanhos diferentes. Corte as duas no mesmo tamanho para poder juntar.';
 $('obs').textContent='Só dá para somar ou subtrair partes do mesmo tamanho. O menor corte comum é o MMC dos denominadores. Somar numeradores e denominadores (1/2 + 1/3 = 2/5) está errado: 2/5 é menor que 1/2!';}
if(modo==='mult'){$('ctl').innerHTML='<h2>Escolha as frações</h2>'+sl('n1','1ª: numerador',0,8,A[0]||2)+sl('d1','1ª: denominador',1,8,A[1]||3)+sl('n2','2ª: numerador',0,8,B[0]||3)+sl('d2','2ª: denominador',1,8,B[1]||4);
 $('lead').textContent='A 1ª fração é pintada em colunas (azul) e a 2ª em linhas (laranja). A parte pintada duas vezes (roxa) é o produto.';
 $('obs').textContent='O quadrado fica dividido em (denominador × denominador) partes, e a parte roxa tem (numerador × numerador) delas. Por isso multiplicamos numerador com numerador e denominador com denominador.';}
let sub=false;if($('tg'))$('tg').onclick=()=>{sub=!sub;$('tg').textContent=sub?'Trocar para adição':'Trocar para subtração';cut=false;draw();};
const lcm=(a,b)=>a/gcd(a,b)*b;
function bar(y,n,d,cor,W=300,h=30,ox=20){let g='';const nb=Math.max(1,Math.ceil(Math.abs(n)/d));for(let b2=0;b2<nb;b2++){for(let k=0;k<d;k++){const on=b2*d+k<Math.abs(n);g+=`<rect x="${ox+k*W/d}" y="${y+b2*(h+6)}" width="${W/d}" height="${h}" fill="${on?cor:'#fff'}" stroke="${NAVY}" stroke-width="1.3"/>`;}}return {g,h:nb*(h+6)};}
function draw(){document.querySelectorAll('#ctl input').forEach(i=>{$(i.id+'v').textContent=i.value;});let g='',y=10;
 if(modo==='equiv'){const n=+$('n').value,d=+$('d').value,k=+$('k').value;let r=bar(y,n,d,BL);g+=T(20,y-2,'',{});g+=r.g;y+=r.h+18;r=bar(y,n*k,d*k,OR);g+=r.g;y+=r.h+4;
  $('eq').innerHTML=`${n}/${d} = ${n*k}/${d*k}`;const s=F(n,d);$('msg').innerHTML=`<div class="msg info">As duas barras têm a mesma parte pintada. Forma irredutível: ${fs(s)}${n>d?' (passa de um inteiro: '+(n/d).toLocaleString('pt-BR',{maximumFractionDigits:3})+')':''}.</div>`;}
 if(modo==='soma'){const n1=+$('n1').value,d1=+$('d1').value,n2=+$('n2').value,d2=+$('d2').value,m=lcm(d1,d2);$('btns').innerHTML='';
  const D1=cut?m:d1,N1=cut?n1*m/d1:n1,D2=cut?m:d2,N2=cut?n2*m/d2:n2;let r=bar(y,N1,D1,BL);g+=r.g;y+=r.h+12;r=bar(y,N2,D2,OR);g+=r.g;y+=r.h+12;
  if(cut){const N=sub?N1-N2:N1+N2;r=bar(y,Math.abs(N),m,N<0?RD:PU);g+=r.g;y+=r.h;const s=F(N,m);
   $('eq').innerHTML=`${n1}/${d1} ${sub?'−':'+'} ${n2}/${d2} = ${N1}/${m} ${sub?'−':'+'} ${N2}/${m} = ${String(N).replace('-','−')}/${m}${fs(s)!==N+'/'+m?' = '+fs(s):''}`;
   $('msg').innerHTML=`<div class="msg ok">Com partes do mesmo tamanho (${m} por inteiro), basta ${sub?'subtrair':'somar'} os numeradores.${N<0?' O resultado é negativo: tiramos mais do que havia.':''}</div>`;}
  else{$('eq').innerHTML=`${n1}/${d1} ${sub?'−':'+'} ${n2}/${d2} = ?`;$('msg').innerHTML=d1===d2?`<div class="msg info">Os denominadores já são iguais!</div>`:`<div class="msg info">Partes de tamanhos diferentes: ${d1} e ${d2} por inteiro. O corte comum é ${m}.</div>`;
   const b=document.createElement('button');b.className='or';b.textContent=`Cortar as duas em ${m} partes`;b.onclick=()=>{cut=true;draw();};$('btns').appendChild(b);}}
 if(modo==='mult'){const n1=+$('n1').value,d1=+$('d1').value,n2=+$('n2').value,d2=+$('d2').value,S=220,ox=60,oy=14;
  for(let i=0;i<d1;i++)for(let j=0;j<d2;j++){const a=i<n1,b=j<n2;const f=a&&b?PU:a?BL:b?OR:'#fff';g+=`<rect x="${ox+i*S/d1}" y="${oy+S-(j+1)*S/d2}" width="${S/d1}" height="${S/d2}" fill="${f}" fill-opacity="${a&&b?.9:.35}" stroke="${NAVY}" stroke-width="1"/>`;}
  g+=`<rect x="${ox}" y="${oy}" width="${S}" height="${S}" fill="none" stroke="${NAVY}" stroke-width="2.5"/>`;y=S+30;const s=F(n1*n2,d1*d2);
  $('eq').innerHTML=`${n1}/${d1} × ${n2}/${d2} = ${n1*n2}/${d1*d2}${fs(s)!==(n1*n2)+'/'+(d1*d2)?' = '+fs(s):''}`;$('msg').innerHTML=`<div class="msg info">O quadrado tem ${d1} × ${d2} = ${d1*d2} partes; ${n1} × ${n2} = ${n1*n2} delas são roxas. Isso é “${n1}/${d1} de ${n2}/${d2}”.</div>`;}
 $('svg').setAttribute('viewBox',`0 0 340 ${y+6}`);$('svg').innerHTML=g;}
document.querySelectorAll('#ctl input').forEach(i=>i.oninput=()=>{cut=false;draw();});draw();
</script>
</body>
</html>
