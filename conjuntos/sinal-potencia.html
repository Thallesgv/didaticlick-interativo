<script>

const f2=v=>fmt(Math.round(v*100)/100);

const svg=(W,H,g)=>`<svg viewBox="0 0 ${W} ${H}" width="${W}">${g}</svg>`;

function draw(){const b=B.get();let h='<table class="t"><tr><th>potência</th><th>fatores</th><th>valor</th></tr>';
 for(let e=0;e<=8;e++){const v=Math.pow(b,e);h+=`<tr><td>(${s(b)})${SUP[e]}</td><td style="font-size:10px">${e?Array(e).fill('('+s(b)+')').join('×'):'—'}</td><td><b style="color:${v<0?'#DC2626':'#2457D6'}">${sg(v)}</b></td></tr>`;}
 $('tb').innerHTML=h+'</table>';$('nt').innerHTML=b<0?`Base negativa: os valores alternam <b style="color:#2457D6">positivo</b> (expoente par) e <b style="color:#DC2626">negativo</b> (ímpar). Cuidado: −${-b}² = −${b*b}, mas (${s(b)})² = ${b*b}.`:b===0?'0 elevado a qualquer expoente positivo dá 0.':'Base positiva: todas as potências são positivas.';}draw();
