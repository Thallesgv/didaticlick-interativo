<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circuito da verdade · DidatiClick</title>
<link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/fin.css">
<script src="../assets/desafio.js"></script><script src="../assets/fin.js"></script><script src="../assets/crime.js?v=2"></script>
</head>
<body>
<header><div class="brand">Didati<b>Click</b> · A Matemática de um Crime</div><h1>Circuito da verdade</h1></header>
<main>
<div class="card"><h2>Chaves e lâmpadas</h2><p class="muted" style="margin-top:0">Toque nas chaves <b>p</b> e <b>q</b> (no desenho ou nos botões). Chave fechada é <b>V</b>, aberta é <b>F</b>. A lâmpada acesa mostra que a frase é verdadeira.</p>
<div class="chips" id="md"></div>
<div class="chips"><button id="bp"></button><button id="bq"></button></div>
<div class="fig" id="fig"></div>
<div id="m"></div><button class="alt" id="nova" style="margin-top:8px;display:none">Outra frase</button></div>
</main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
(()=>{
let p=true,q=false,alvo=null,acertos=0,contou=false;
const okF=()=>M.get()==1&&alvo&&p==alvo.p&&q==alvo.q;
MIS.def(()=>[
 ['Escolha <b>Frases de depoimento</b> e ajuste as chaves para as três lâmpadas baterem com o que se sabe.',okF,()=>'Isso! p = '+(alvo.p?'V':'F')+' e q = '+(alvo.q?'V':'F')+'. As três lâmpadas batem com o depoimento.',()=>{if(M.get()!=1)return 'Escolha o modo Frases de depoimento.';const a=alvo,f=a.f,v=b=>b?'<b style="color:#15803D">V</b>':'<b style="color:#B91C1C">F</b>';return `p: “${f[0]}”. q: “${f[1]}”.<br>Sabe-se que “${f[0]} e ${f[1]}” é ${v(a.p&&a.q)}, “${f[0]} ou ${f[1]}” é ${v(a.p||a.q)} e “não é verdade que ${f[0]}” é ${v(!a.p)}. Ajuste as chaves.`;}],
 ['Acerte <b>3 frases</b> (use Outra frase).',()=>acertos>=3,'Três depoimentos traduzidos em chaves: E, OU e NÃO viraram circuitos.',()=>'Frases acertadas: '+acertos+' de 3.'+(okF()?' Aperte Outra frase.':'')],
 ['No modo Explorar, tente acender <b>as três lâmpadas</b> ao mesmo tempo. Quantas dá para acender no máximo?',()=>M.get()==0&&!p&&q,'No máximo duas (p = F e q = V): p E q precisa de p = V, e NÃO p precisa de p = F. As duas nunca acendem juntas.',()=>M.get()?'Volte ao modo Explorar.':'Teste as quatro combinações das chaves.'],
 ['Deixe acesa <b>só a lâmpada do OU</b>.',()=>M.get()==0&&p&&!q,'p = V e q = F: o OU acende (basta um caminho), o E não (falta q) e o NÃO apaga (p é V).',()=>M.get()?'Volte ao modo Explorar.':'Teste as combinações.']]);
const FR=[['Bernardo estava no museu','o alarme tocou'],['a janela estava aberta','o portão estava trancado'],['Heitor viajou','Glória mentiu'],['o carro saiu','a câmera filmou']];
const M=chips('md',['Explorar','Frases de depoimento'],0,()=>{$('nova').style.display=M.get()?'':'none';if(M.get())sortear();draw();});
function sortear(){contou=false;const f=P(FR);let n;do{n=rint(0,3);}while(alvo&&n==alvo.n);alvo={f,n,p:n<2,q:n%2==0};}
$('nova').onclick=()=>{sortear();draw();};
$('bp').onclick=()=>{p=!p;draw();};$('bq').onclick=()=>{q=!q;draw();};
$('fig').onclick=e=>{const g=e.target.closest('[data-k]');if(!g)return;if(g.dataset.k=='p')p=!p;else q=!q;draw();};
function chave(x,y,on,k){return `<g data-k="${k}" style="cursor:pointer"><rect x="${x-6}" y="${y-22}" width="52" height="34" fill="transparent"/><circle cx="${x}" cy="${y}" r="4" fill="${NAVY}"/><circle cx="${x+40}" cy="${y}" r="4" fill="${NAVY}"/>`+LN(x,y,on?x+40:x+34,on?y:y-18,on?GREEN:'#B91C1C',4)+TX(x+20,y+16,k+' = '+(on?'V':'F'),{fs:10,c:on?GREEN:'#B91C1C'})+'</g>';}
function lampada(x,y,on){return (on?`<circle cx="${x}" cy="${y}" r="20" fill="${LIGHT}" opacity=".55"/>`:'')+`<circle cx="${x}" cy="${y}" r="12" fill="${on?ORANGE:'#E5E7EB'}" stroke="${NAVY}" stroke-width="2"/>`+LN(x-6,y+12,x+6,y+12,NAVY,3);}
function bateria(x,y){return LN(x,y-12,x,y+12,NAVY,3)+LN(x+7,y-6,x+7,y+6,NAVY,5);}
function draw(){
 $('bp').textContent='Chave p: '+(p?'fechada (V)':'aberta (F)');$('bq').textContent='Chave q: '+(q?'fechada (V)':'aberta (F)');
 $('bp').className=p?'on':'';$('bq').className=q?'on':'';
 const E=p&&q,O=p||q,N=!p;let g=`<rect width="340" height="330" fill="#F8FAFC"/>`;
 // E: série
 g+=TX(10,18,'p E q (em série)',{a:'start',fs:12})+TX(330,18,E?'V':'F',{a:'end',fs:14,c:E?GREEN:'#B91C1C'});
 g+=bateria(30,60)+LN(30,48,30,32,NAVY)+LN(30,32,95,32,NAVY)+LN(135,32,175,32,NAVY)+LN(215,32,275,32,NAVY)+LN(30,72,30,90,NAVY)+LN(30,90,290,90,NAVY)+LN(290,90,290,72,NAVY)+LN(275,32,290,32,NAVY)+LN(290,32,290,48,NAVY);
 g+=chave(95,32,p,'p')+chave(175,32,q,'q')+lampada(290,60,E);
 // OU: paralelo
 const y0=120;g+=TX(10,y0+18,'p OU q (em paralelo)',{a:'start',fs:12})+TX(330,y0+18,O?'V':'F',{a:'end',fs:14,c:O?GREEN:'#B91C1C'});
 g+=bateria(30,y0+80)+LN(30,y0+68,30,y0+40,NAVY)+LN(30,y0+40,115,y0+40,NAVY)+LN(155,y0+40,200,y0+40,NAVY)+LN(80,y0+40,80,y0+80,NAVY)+LN(80,y0+80,115,y0+80,NAVY)+LN(155,y0+80,200,y0+80,NAVY)+LN(200,y0+40,200,y0+80,NAVY)+LN(200,y0+60,275,y0+60,NAVY);
 g+=LN(30,y0+92,30,y0+110,NAVY)+LN(30,y0+110,290,y0+110,NAVY)+LN(290,y0+110,290,y0+92,NAVY)+LN(275,y0+60,278,y0+60,NAVY);
 g+=chave(115,y0+40,p,'p')+chave(115,y0+80,q,'q')+lampada(290,y0+76,O);
 // NÃO p
 const y1=250;g+=TX(10,y1+12,'NÃO p (a chave p desliga a lâmpada)',{a:'start',fs:12})+TX(330,y1+12,N?'V':'F',{a:'end',fs:14,c:N?GREEN:'#B91C1C'});
 g+=chave(115,y1+45,p,'p')+LN(60,y1+45,115,y1+45,NAVY)+LN(155,y1+45,190,y1+45,NAVY)+TX(225,y1+49,'→',{fs:18})+lampada(290,y1+45,N);
 $('fig').innerHTML=SVG(340,330,g);
if(okF()&&!contou){contou=true;acertos++;}MIS.ver('m');}
draw();
})();
</script>
</body>
</html>
