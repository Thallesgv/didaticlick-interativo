<!--T: Escolha o seu caminho-->
<div class="card"><div class="status" id="st"></div><div class="hist" id="tx"></div><div class="ops" id="ops"></div></div>
<div class="card hide" id="lic"></div>
<script>
const H=(FIN.av||{})[Q.get('id')];
if(!H){$('title').textContent='História não encontrada';}
else{document.title=H.title+' · DidatiClick';$('title').textContent=H.title;
 let v,trilha;
 function stat(){$('st').innerHTML=Object.keys(H.vars).map(k=>`<span>${H.vars[k][0]} ${H.vars[k][2]?H.vars[k][2](v[k]):v[k]}</span>`).join('');}
 function vai(id){const n=H.nos[id];trilha.push(id);stat();
  $('tx').innerHTML=(typeof n.t==='function'?n.t(v):n.t);
  if(n.fim){$('ops').innerHTML='';$('lic').classList.remove('hide');
   $('lic').innerHTML=`<h2>${n.fim}</h2><p style="margin:0">${n.lic||''}</p><div class="row" style="margin-top:10px"><button class="or" id="de">Jogar de novo e escolher diferente</button></div>`;$('de').onclick=ini;return;}
  $('ops').innerHTML=n.ops.map((o,k)=>`<button data-k="${k}">${o[0]}</button>`).join('');
  $('ops').querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=n.ops[+b.dataset.k];if(o[2])Object.keys(o[2]).forEach(k=>v[k]+=o[2][k]);
   let prox=typeof o[1]==='function'?o[1](v):o[1];vai(prox);scrollTo(0,0);});}
 function ini(){v={};Object.keys(H.vars).forEach(k=>v[k]=H.vars[k][1]);trilha=[];$('lic').classList.add('hide');vai('ini');}
 ini();}
</script>
