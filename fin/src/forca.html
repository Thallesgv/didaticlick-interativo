<!--T: Forca do dinheiro-->
<div class="card"><div class="placar" id="placar">Palavras: 0 de 0</div>
<p class="muted" id="sub" style="margin-top:0"></p>
<div class="vidas" id="vidas"></div>
<div class="dica" id="dica"></div>
<div class="palavra" id="pal"></div>
<div class="teclado" id="tec"></div>
<div id="dm"></div>
<div class="row" style="margin-top:10px"><button class="or hide" id="prox">Próxima palavra ›</button></div>
</div>
<div class="card hide" id="fim"></div>
<script>
const F=FIN.forca[Q.get('id')];
const tira=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
if(!F){$('title').textContent='Jogo não encontrado';}
else{document.title=F.title+' · DidatiClick';$('title').textContent=F.title;
 $('sub').innerHTML=(F.sub||'Descubra a palavra pela dica.')+' Você pode errar 6 letras.';
 let lista,i,ac,chutes,erros;
 function inicio(){lista=shuffle(F.palavras);i=0;ac=0;$('fim').classList.add('hide');nova();}
 function nova(){chutes=new Set();erros=0;msg('dm','');$('prox').classList.add('hide');
  $('dica').innerHTML='<b>Dica:</b> '+lista[i][1];
  $('tec').innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<button data-l="${l}">${l}</button>`).join('');
  $('tec').querySelectorAll('button').forEach(b=>b.onclick=()=>chuta(b.dataset.l));desenha();}
 function desenha(){const w=lista[i][0];
  $('pal').innerHTML=w.split('').map(c=>c===' '||c==='-'?`<span class="sp">${c==='-'?'-':''}</span>`:`<span>${chutes.has(tira(c))?c.toUpperCase():''}</span>`).join('');
  $('vidas').textContent='❤️'.repeat(6-erros)+'🤍'.repeat(erros);
  $('placar').textContent=`Palavras: ${ac} de ${lista.length}`;}
 function chuta(l){if(chutes.has(l))return;chutes.add(l);const w=tira(lista[i][0]);const b=$('tec').querySelector(`[data-l="${l}"]`);b.disabled=true;
  if(w.includes(l))b.className='okk';else{b.className='bad';erros++;}
  desenha();const ganhou=w.split('').every(c=>!/[A-Z]/.test(c)||chutes.has(c));
  if(ganhou||erros>=6){if(ganhou)ac++;$('tec').querySelectorAll('button').forEach(x=>x.disabled=true);
   chutes=new Set(w);desenha();
   msg('dm',(ganhou?'Acertou! ':'A palavra era <b>'+lista[i][0].toUpperCase()+'</b>. ')+(lista[i][2]||''),ganhou?'ok':'bad');
   i++;if(i<lista.length)$('prox').classList.remove('hide');else fim();}}
 function fim(){$('placar').textContent=`Palavras: ${ac} de ${lista.length}`;$('fim').classList.remove('hide');
  $('fim').innerHTML=`<h2>Você descobriu ${ac} de ${lista.length} palavras</h2><p>${ac===lista.length?'Dicionário ambulante!':'Releia os verbetes da apostila e tente de novo.'}</p><div class="row"><button class="or" id="de">Jogar de novo</button></div>`;
  $('de').onclick=()=>{inicio();scrollTo(0,0);};}
 document.addEventListener('keydown',e=>{const l=tira(e.key||'');if(/^[A-Z]$/.test(l)&&$('tec').querySelector(`[data-l="${l}"]`)&&!$('tec').querySelector(`[data-l="${l}"]`).disabled)chuta(l);});
 $('prox').onclick=nova;inicio();}
</script>
