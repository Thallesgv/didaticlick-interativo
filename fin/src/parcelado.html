<!--T: À vista ou parcelado?-->
<div class="card"><div class="placar" id="placar">Acertos: 0 de 0</div>
<p class="muted" style="margin-top:0">Compare o <b>total</b> pago, não a parcela. Quanto se paga a mais no parcelado?</p>
<div id="lv" class="lv hide">QUESTÃO DA APOSTILA</div><div class="dq" id="dq"></div><div id="area"></div>
<div class="row" style="margin-top:10px"><button class="or" id="ok">OK</button><button class="alt" id="novo">Outra compra</button></div><div id="dm"></div></div>
<div class="card hide" id="rs"></div>
<script>
const PR=['📺 TV','🚲 bicicleta','📱 celular','💻 notebook','🎮 videogame','🛏️ cama','🧊 geladeira'];
D.ciclo({livros:[{it:'📺 TV',av:1080,n:4,p:300,txt:'R$ 1.200 com 10% de desconto no Pix'}],
 sortear(){const it=pick(PR),av=pick([400,600,800,900,1000,1200,1500,2000]),n=pick([3,4,5,6,8,10,12]),p=Math.ceil(av*pick([1,1.05,1.1,1.15,1.2,1.3])/n);return {it,av,n,p};},
 montar(q){$('dq').innerHTML=`${q.it}: <span class="k">${R0(q.av)} à vista</span>${q.txt?' ('+q.txt+')':''} ou <span class="k">${q.n} × ${R0(q.p)}</span>. Qual o total parcelado e quanto ele custa a mais?`;
  $('area').innerHTML='<div class="ask">Total parcelado: R$ '+box('r1',100)+'</div><div class="ask">A mais: R$ '+box('r2',100)+'</div>';},
 conferir(q){const v=D.ler(['r1','r2']);if(!v)return null;const t=q.n*q.p,ok=[Math.abs(v[0]-t)<0.01,Math.abs(v[1]-(t-q.av))<0.01];D.marcar(['r1','r2'],ok);
  return {ok:ok[0]&&ok[1],exp:`${q.n} × ${q.p} = ${R0(t)}. A mais: ${R0(t)} − ${R0(q.av)} = ${R0(t-q.av)} (${pct(100*(t-q.av)/q.av)} do preço à vista).`+(t===q.av?' Aqui é sem juros de verdade: parcelar não custa nada a mais.':' Se você tem o dinheiro, à vista sai mais barato.')};}});
</script>
