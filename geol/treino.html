<header><div class="brand">Didati<b>Click</b> · A Matemática na Geologia</div><h1>Pratique</h1></header>

<div class="card"><h2 id="mt">Exercícios sorteados</h2><p class="muted" style="margin-top:0">Cada vez que você aperta <b>Outro exercício</b>, um problema novo é sorteado. Responda, confira e veja a explicação.</p>

<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
(()=>{
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const LIV={'geo1':{T:["Inclinação: ângulo e porcentagem", "A tangente da encosta", "O clinômetro e o fio de prumo", "Postes, árvores e muros tortos", "A lei dos 30%", "Altura do morro sem subir nele"],G:{1:()=>{const t=R(0,2);
 if(t==0){const h=R(4,40)*5,d=R(1,Math.round(h*0.6));return{q:`Uma rua sobe <b>${d} m</b> em <b>${h} m</b> de distância horizontal. Qual a declividade, em %? (uma casa)`,a:Math.round(d/h*1000)/10,tol:0.06,exp:`${d} ÷ ${h} × 100 ≈ ${fmt(Math.round(d/h*1000)/10)}%.`};}
 if(t==1){const p=R(5,90),h=R(2,20)*5;return{q:`Um terreno tem <b>${p}%</b> de declividade e <b>${h} m</b> na horizontal. Qual o desnível, em metros?`,a:p*h/100,tol:0.01,exp:`${fmt(p/100)} × ${h} = ${fmt(p*h/100)} m.`};}
 return P([{q:'Uma rampa de 100% tem ângulo de:',opts:['45°','90°','100°'],a:'45°',exp:'Desnível igual à horizontal.'},{q:'Uma encosta pode ter mais de 100%?',opts:['sim','não'],a:'sim',exp:'Basta passar de 45°.'},{q:'A distância usada na declividade é:',opts:['a horizontal','a medida na rampa','a altura'],a:'a horizontal',exp:'A do mapa.'}]);},
2:()=>{const T={10:0.176,15:0.268,20:0.364,25:0.466,30:0.577,35:0.700,40:0.839,45:1,50:1.192,60:1.732};const ks=Object.keys(T);const t=R(0,2);
 if(t==0){const a=P(ks),h=R(2,20)*5;return{q:`Uma encosta de <b>${a}°</b> tem <b>${h} m</b> na horizontal. Qual o desnível? (tg ${a}° ≈ ${fmt(T[a])}; uma casa)`,a:Math.round(h*T[a]*10)/10,tol:0.06,exp:`${h} × ${fmt(T[a])} ≈ ${fmt(Math.round(h*T[a]*10)/10)} m.`};}
 if(t==1){const a=P(ks);return{q:`Qual a declividade de uma encosta de <b>${a}°</b>, em %? (tg ${a}° ≈ ${fmt(T[a])}; uma casa)`,a:Math.round(T[a]*1000)/10,tol:0.06,exp:`100 × ${fmt(T[a])} = ${fmt(Math.round(T[a]*1000)/10)}%.`};}
 const o=R(3,30),ad=R(4,40);return{q:`Num triângulo retângulo, o cateto oposto mede <b>${o}</b> e o adjacente <b>${ad}</b>. Quanto vale a tangente? (duas casas)`,a:Math.round(o/ad*100)/100,tol:0.011,exp:`${o} ÷ ${ad} ≈ ${fmt(Math.round(o/ad*100)/100)}.`};},
3:()=>{const S={20:[0.342,0.940],30:[0.5,0.866],35:[0.574,0.819],40:[0.643,0.766],45:[0.707,0.707],60:[0.866,0.5]};const a=P(Object.keys(S)),L=R(10,100),t=R(0,1);
 if(t==0)return{q:`Uma encosta de <b>${a}°</b> tem <b>${L} m</b> medidos ao longo dela. Qual o desnível? (sen ${a}° ≈ ${fmt(S[a][0])}; uma casa)`,a:Math.round(L*S[a][0]*10)/10,tol:0.06,exp:`${L} × ${fmt(S[a][0])} ≈ ${fmt(Math.round(L*S[a][0]*10)/10)} m.`};
 return{q:`Uma encosta de <b>${a}°</b> tem <b>${L} m</b> medidos ao longo dela. Qual a distância horizontal? (cos ${a}° ≈ ${fmt(S[a][1])}; uma casa)`,a:Math.round(L*S[a][1]*10)/10,tol:0.06,exp:`${L} × ${fmt(S[a][1])} ≈ ${fmt(Math.round(L*S[a][1]*10)/10)} m.`};},
4:()=>{const t=R(0,2);
 if(t==0){const f=P([1,1.5,2]),g=R(1,6);const x=Math.round(f*100*0.0175*g*10)/10;return{q:`Fio de prumo de <b>${fmt(f)} m</b>, afastado <b>${fmt(x)} cm</b> do poste. Quantos graus, aproximadamente? (tg 1° ≈ 0,0175)`,a:g,tol:0.15,exp:`tg = ${fmt(x)} ÷ ${f*100} ≈ ${fmt(Math.round(x/(f*100)*1000)/1000)}; ÷ 0,0175 ≈ ${g}°.`};}
 if(t==1){const h=R(4,14),tg=P([0.03,0.05,0.07,0.1]);return{q:`Um poste de <b>${h} m</b> está inclinado com tangente <b>${fmt(tg)}</b>. Quantos centímetros o topo andou?`,a:Math.round(h*tg*100),tol:0.6,exp:`${h} × ${fmt(tg)} = ${fmt(Math.round(h*tg*100)/100)} m = ${Math.round(h*tg*100)} cm.`};}
 const c=R(10,80),a=R(2,20);return{q:`O topo de um poste andou <b>${c*a} cm</b> em <b>${a} anos</b>. Quantos cm por ano, em média?`,a:c,exp:`${c*a} ÷ ${a} = ${c} cm/ano.`};},
5:()=>{const t=R(0,2);
 if(t==0){const h=R(4,20)*5,d=R(1,Math.round(h*0.6));const p=d/h*100;return{q:`Um terreno sobe <b>${d} m</b> em <b>${h} m</b> na horizontal. Pela Lei 6.766, ele pode ser loteado sem exigências especiais?`,opts:['sim','não'],a:p<30?'sim':'não',exp:`${fmt(Math.round(p*10)/10)}% ${p<30?'<':'≥'} 30%.`};}
 if(t==1){const h=R(2,20)*5;return{q:`Num terreno com <b>${h} m</b> na horizontal, qual o desnível que já atinge o limite de 30%?`,a:0.3*h,tol:0.01,exp:`0,30 × ${h} = ${fmt(0.3*h)} m.`};}
 const p=P([[40,'não'],[95,'não'],[100,'não'],[110,'sim'],[150,'sim']]);return{q:`Uma encosta de <b>${p[0]}%</b> é área de preservação permanente pelo Código Florestal (acima de 45°)?`,opts:['sim','não'],a:p[1],exp:`45° = 100%: ${p[0]}% ${p[1]=='sim'?'passa':'não passa'} disso.`};},
6:()=>{const T={25:0.466,30:0.577,35:0.700,40:0.839,45:1,60:1.732};const t=R(0,2);
 if(t==0){const a=P(Object.keys(T)),d=R(5,60);return{q:`De <b>${d} m</b> da base, o topo de uma árvore aparece a <b>${a}°</b>. Qual a altura? (tg ${a}° ≈ ${fmt(T[a])}; uma casa)`,a:Math.round(d*T[a]*10)/10,tol:0.06,exp:`${d} × ${fmt(T[a])} ≈ ${fmt(Math.round(d*T[a]*10)/10)} m.`};}
 if(t==1){const ab=P([[30,45],[35,45],[25,45],[30,60],[40,60]]),d=R(2,10)*5;const ta=T[ab[0]],tb=T[ab[1]];const h=Math.round(d*ta*tb/(tb-ta)*10)/10;return{q:`De P1 o topo aparece a <b>${ab[0]}°</b>; andando <b>${d} m</b> até P2, aparece a <b>${ab[1]}°</b>. Qual a altura? (tg ${ab[0]}° ≈ ${fmt(ta)}; tg ${ab[1]}° ≈ ${fmt(tb)}; uma casa)`,a:h,tol:0.15,exp:`h = ${d} × ${fmt(ta)} × ${fmt(tb)} ÷ (${fmt(tb)} − ${fmt(ta)}) ≈ ${fmt(h)} m.`};}
 const h=R(5,40),o=P([1.5,1.6,1.7]);return{q:`A conta deu <b>${h} m</b> acima dos olhos, que estão a <b>${fmt(o)} m</b> do chão. Qual a altura do objeto?`,a:h+o,tol:0.01,exp:`${h} + ${fmt(o)} = ${fmt(h+o)} m.`};}}},'geo2':{T:["Escala: 1 cm vale quanto?", "Curvas de nível", "Declividade no mapa", "O perfil topográfico", "Áreas no mapa e no terreno", "Drone e GPS: medir de cima", "O mapa de risco"],G:{1:()=>{const N=P([500,1000,2000,2500,5000,10000,25000]),t=R(0,2);
 if(t==0){const m=R(5,90)/10;return{q:`Num mapa <b>1 : ${N.toLocaleString('pt-BR')}</b>, duas casas estão a <b>${fmt(m)} cm</b>. Qual a distância real, em metros?`,a:m*N/100,tol:0.01,exp:`${fmt(m)} × ${N/100} m = ${fmt(Math.round(m*N)/100)} m.`};}
 if(t==1){const d=R(2,60)*N/100/10;return{q:`Num mapa <b>1 : ${N.toLocaleString('pt-BR')}</b>, com quantos centímetros aparece uma distância real de <b>${fmt(d)} m</b>?`,a:d/(N/100),tol:0.01,exp:`${fmt(d)} ÷ ${N/100} = ${fmt(Math.round(d/(N/100)*100)/100)} cm.`};}
 return{q:`Na escala <b>1 : ${N.toLocaleString('pt-BR')}</b>, quantos metros vale 1 cm?`,a:N/100,exp:`${N.toLocaleString('pt-BR')} cm = ${N/100} m.`};},
2:()=>{const t=R(0,2);
 if(t==0){const e=P([1,2,5,10]),a=R(90,97)*10,b=a+R(3,10)*e;return{q:`Com equidistância de <b>${e} m</b>, quantas curvas há de <b>${a} m</b> a <b>${b} m</b>, contando as duas?`,a:(b-a)/e+1,exp:`(${b} − ${a}) ÷ ${e} + 1 = ${(b-a)/e+1}.`};}
 if(t==1){const e=P([5,10]),a=R(90,97)*10,f=P([0.2,0.25,0.4,0.5,0.6,0.75,0.8]);return{q:`Um ponto fica a <b>${fmt(f)}</b> do caminho entre a curva de <b>${a} m</b> e a de <b>${a+e} m</b>. Qual a altitude?`,a:a+f*e,tol:0.01,exp:`${a} + ${fmt(f)} × ${e} = ${fmt(a+f*e)} m.`};}
 return P([{q:'Curvas de nível juntas indicam terreno:',opts:['íngreme','plano'],a:'íngreme',exp:'Sobe muito em pouco espaço.'},{q:'Duas curvas de nível podem se cruzar?',opts:['não','sim'],a:'não',exp:'Um ponto não tem duas altitudes.'},{q:'Curvas em V com a ponta para o alto do morro indicam:',opts:['vale','crista'],a:'vale',exp:'Por ali a água desce.'}]);},
3:()=>{const t=R(0,1),N=P([1000,2000,5000]),e=P([1,2,5,10]);
 if(t==0){const m=R(10,120)/10,h=m*N/1000,d=Math.round(e/h*1000)/10;return{q:`Curvas de <b>${e} m</b> estão a <b>${fmt(m)} mm</b> uma da outra num mapa <b>1 : ${N.toLocaleString('pt-BR')}</b>. Qual a declividade, em %? (uma casa)`,a:d,tol:0.06,exp:`Horizontal: ${fmt(m)} × ${N.toLocaleString('pt-BR')} mm = ${fmt(Math.round(h*100)/100)} m. ${e} ÷ ${fmt(Math.round(h*100)/100)} ≈ ${fmt(d)}%.`};}
 const p=P([20,25,30,40,50,80,100]),h=e/(p/100),m=Math.round(h*1000/N*100)/100;return{q:`Com curvas de <b>${e} m</b> em <b>1 : ${N.toLocaleString('pt-BR')}</b>, a quantos mm ficam as curvas num terreno de <b>${p}%</b>? (duas casas)`,a:m,tol:0.011,exp:`No chão: ${e} ÷ ${fmt(p/100)} = ${fmt(Math.round(h*100)/100)} m; no mapa: ÷ ${N.toLocaleString('pt-BR')} ≈ ${fmt(m)} mm.`};},
4:()=>{const t=R(0,2);
 if(t==0){const H=P([2000,5000,10000]),V=P([500,1000,2000].filter(v=>v<H));return{q:`Escala horizontal <b>1 : ${H.toLocaleString('pt-BR')}</b> e vertical <b>1 : ${V.toLocaleString('pt-BR')}</b>. Qual o exagero vertical?`,a:H/V,tol:0.01,exp:`${H.toLocaleString('pt-BR')} ÷ ${V.toLocaleString('pt-BR')} = ${fmt(H/V)}.`};}
 if(t==1){const p=R(5,60)*2,x=P([2,3,4,5]);return{q:`Uma encosta de <b>${p}%</b> aparece com quantos % num perfil com exagero <b>${x}</b>?`,a:p*x,exp:`${p} × ${x} = ${p*x}%.`};}
 const z=R(900,980),x=R(10,60),s=P([0.1,0.2,0.3,0.5,0.7]);return{q:`O perfil começa a <b>${z} m</b> e sobe <b>${Math.round(s*100)}%</b>. Qual a altitude a <b>${x} m</b> do início? (uma casa)`,a:Math.round((z+x*s)*10)/10,tol:0.06,exp:`${z} + ${x} × ${fmt(s)} = ${fmt(Math.round((z+x*s)*10)/10)} m.`};},
5:()=>{const t=R(0,2),N=P([500,1000,2000,5000,10000]),c=N/100;
 if(t==0){const a=R(2,40);return{q:`Num mapa <b>1 : ${N.toLocaleString('pt-BR')}</b>, uma mancha tem <b>${a} cm²</b>. Qual a área real, em m²?`,a:a*c*c,exp:`1 cm² = ${c} × ${c} = ${fmt(c*c)} m²; × ${a} = ${fmt(a*c*c)} m².`};}
 if(t==1){const i=R(3,20),p=R(2,12)*2;return{q:`Numa malha de 1 cm, uma mancha cobre <b>${i}</b> quadradinhos inteiros e <b>${p}</b> pedaços. Qual a área aproximada, em cm²?`,a:i+p/2,exp:`${i} + ${p} ÷ 2 = ${i+p/2} cm².`};}
 const C={30:0.866,35:0.819,40:0.766,45:0.707,60:0.5};const g=P(Object.keys(C)),A=R(5,60)*100;return{q:`Uma encosta de <b>${g}°</b> tem <b>${fmt(A)} m²</b> no mapa. Qual a área medida na encosta? (cos ${g}° ≈ ${fmt(C[g])}; arredonde para m² inteiro)`,a:Math.round(A/C[g]),tol:2,exp:`${fmt(A)} ÷ ${fmt(C[g])} ≈ ${fmt(Math.round(A/C[g]))} m².`};},
6:()=>{const t=R(0,3);
 if(t==0){const h=R(4,24)*5;return{q:`A câmera enxerga uma faixa de 1,5 × a altura, com <b>4 000 pixels</b>. A <b>${h} m</b> de altura, quantos cm de chão cobre cada pixel? (três casas)`,a:Math.round(1.5*h/4000*100*1000)/1000,tol:0.002,exp:`Faixa ${fmt(1.5*h)} m; ${fmt(1.5*h)} ÷ 4 000 = ${fmt(Math.round(1.5*h/40*1000)/1000)} cm.`};}
 if(t==1){const f=R(6,30)*5,o=P([60,70,75,80,85,90]);return{q:`Faixa de <b>${f} m</b> e sobreposição de <b>${o}%</b>. Quantos metros o drone avança entre duas fotos?`,a:f*(100-o)/100,tol:0.01,exp:`${100-o}% de ${f} = ${fmt(f*(100-o)/100)} m.`};}
 const k=R(2,15),tr=P([[3,4,5],[5,12,13],[8,15,17],[6,8,10]]);return{q:`Dois pontos têm <b>ΔE = ${tr[0]*k} m</b> e <b>ΔN = ${tr[1]*k} m</b>. Qual a distância horizontal?`,a:tr[2]*k,exp:`√(${tr[0]*k}² + ${tr[1]*k}²) = ${tr[2]*k} m.`};},
7:()=>{const d=P([10,20,25,35,45,55,65,80,95,105,120,140]),s=R(0,5),c=d<=30?1:d<=60?2:d<=100?3:4,n=c+s,g=n<=2?'R1':n<=4?'R2':n<=6?'R3':'R4';
 if(R(0,1)==0)return{q:`Pela ficha do livro, um setor com <b>${d}%</b> e <b>${s}</b> sinais de movimento tem que grau de risco?`,opts:['R1','R2','R3','R4'],a:g,exp:`Classe ${c} + ${s} sinais = nota ${n}: ${g}.`};
 return{q:`Pela ficha do livro, qual a nota de um setor com <b>${d}%</b> e <b>${s}</b> sinais?`,a:n,exp:`Declividade dá ${c}; ${c} + ${s} = ${n}.`};}}}};
const qs=new URLSearchParams(location.search);let l=qs.get('l');if(!LIV[l])l='geo1';const {T,G}=LIV[l];
let m=+(qs.get('m'))||1;if(!G[m])m=1;let cur,ok=0,tot=0,feito=false,esc=null;
function mods(){$('mods').innerHTML=T.map((t,i)=>`<button class="${i+1==m?'':'alt'}" style="padding:4px 10px;font-size:13px" title="${t}" data-m="${i+1}">${i+1}</button>`).join('');
 document.querySelectorAll('#mods button').forEach(b=>b.onclick=()=>{m=+b.dataset.m;history.replaceState(null,'','?l='+l+'&m='+m);mods();novo();});}
function novo(){cur=G[m]();feito=false;esc=null;$('mt').textContent='Módulo '+m+' · '+T[m-1];$('q').innerHTML=cur.q;$('fb').style.display='none';
 $('resp').innerHTML=cur.opts?cur.opts.map(o=>`<button class="alt opt" style="margin:3px">${o}</button>`).join(''):'<input type="text" inputmode="decimal" id="r" placeholder="sua resposta" style="font-size:16px;padding:8px;border:2px solid #D7DEEA;border-radius:10px;width:100%;box-sizing:border-box">';
 if(cur.opts)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{esc=b.textContent;document.querySelectorAll('.opt').forEach(x=>x.className='alt opt');b.className='opt';});
 else $('r').onkeydown=e=>{if(e.key=='Enter')conf();};}
function conf(){if(feito)return;let v=cur.opts?esc:($('r').value.trim());if(v===null||v==='')return;
 const certo=cur.opts?v==cur.a:Math.abs(+v.replace(',','.').replace('−','-')-cur.a)<=(cur.tol||0.001);
 feito=true;tot++;if(certo)ok++;$('fb').style.display='block';$('fb').className='msg '+(certo?'ok':'bad');$('fb').innerHTML=(certo?'<b>Certo!</b> ':'<b>Ainda não.</b> A resposta é <b>'+(typeof cur.a=='number'?fmt(cur.a):cur.a)+'</b>. ')+cur.exp;
 $('placar').textContent=`Acertos nesta visita: ${ok} de ${tot}`;}
$('conf').onclick=conf;$('novo').onclick=novo;mods();novo();
})();
</script>
