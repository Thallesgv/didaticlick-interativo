<!--T: Base 60 e juros-->
<div class="card"><h2>Escreva como um escriba</h2><p class="muted">Digite um número. A máquina separa em "sessentas" e desenha cada posição com cunhas: <b>▼</b> vale 1 e <b>◀</b> vale 10.</p>
<input type="number" id="n" value="135" min="1" max="215999">
<svg id="sv" viewBox="0 0 400 120" style="background:#F3E3CF;border-radius:10px;margin-top:8px"></svg><div class="out" id="out"></div></div>
<div class="card"><h2>Empréstimo a 1/60 por mês</h2><p class="muted">Na Mesopotâmia, a taxa normal equivalia a 20% ao ano: 1/60 do valor por mês.</p>
<label class="lbl">Prata emprestada: <span id="vp"></span> siclos</label><div class="sl"><input type="range" id="p" min="60" max="600" step="60" value="120"></div>
<label class="lbl">Meses: <span id="vm"></span></label><div class="sl"><input type="range" id="m" min="0" max="36" value="12"></div>
<svg id="bar" viewBox="0 0 400 70" style="background:#fff;border-radius:10px"></svg><div class="out" id="out2"></div></div>
<script>
const $=i=>document.getElementById(i);
function cunhas(d,x){let s='',t=Math.floor(d/10),u=d%10,cx=x;for(let i=0;i<t;i++){s+=`<polygon points="${cx},${55} ${cx+14},${45} ${cx+14},${65}" fill="#6B3E1F"/>`;cx+=12}
 for(let i=0;i<u;i++){const r=Math.floor(i/3),c=i%3;s+=`<polygon points="${cx+c*11},${30+r*22} ${cx+c*11+10},${30+r*22} ${cx+c*11+5},${48+r*22}" fill="#6B3E1F"/>`}return [s,cx+(u?33:4)-x]}
function draw(){let n=Math.max(1,Math.min(215999,Math.floor(+$('n').value||1)));const dig=[];let k=n;while(k>0){dig.unshift(k%60);k=Math.floor(k/60)}
 let s='',x=12;const ws=[];dig.forEach((d,i)=>{const[c,w]=cunhas(d,x);s+=c;s+=`<text x="${x+w/2}" y="112" font-size="12" text-anchor="middle" fill="#0E2354" font-weight="700">${d}</text>`;x+=Math.max(w,24)+26});
 $('sv').innerHTML=s;const pot=['× 1','× 60','× 3 600'];$('out').innerHTML=`${n} = `+dig.map((d,i)=>`${d} ${pot[dig.length-1-i]}`).join(' + ')+` → em base 60: <b>${dig.join(',')}</b>`;}
function juros(){const p=+$('p').value,m=+$('m').value;$('vp').textContent=p;$('vm').textContent=m;const j=p*m/60,tot=p+j,max=600*(1+36/60);
 $('bar').innerHTML=`<rect x="10" y="20" width="${380*p/max}" height="30" fill="#0E2354"/><rect x="${10+380*p/max}" y="20" width="${380*j/max}" height="30" fill="#F78D33"/><text x="10" y="14" font-size="11" fill="#0E2354">emprestado</text><text x="${10+380*p/max}" y="64" font-size="11" fill="#C2410C">juros</text>`;
 $('out2').innerHTML=`Juros: ${p} × ${m}/60 = <b>${(+j.toFixed(2)).toLocaleString('pt-BR')} siclos</b>. Total a pagar: <b>${(+tot.toFixed(2)).toLocaleString('pt-BR')}</b>. Em 12 meses, os juros são 12/60 = 20%.`;}
$('n').oninput=draw;$('p').oninput=juros;$('m').oninput=juros;draw();juros();
</script>
