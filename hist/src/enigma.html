<!--T: Mini-Enigma-->
<div class="card"><h2>Um rotor que gira</h2><p class="muted">Este é um rotor com a fiação do rotor I da Enigma. A cada letra, ele gira uma posição, então a mesma letra vira letras diferentes.</p>
<label class="lbl">Posição inicial</label><select id="p"></select>
<label class="lbl">Mensagem</label><input type="text" id="t" value="ATAQUE AO AMANHECER">
<div class="row" style="display:flex;gap:6px;margin-top:8px"><button id="cif">Cifrar</button><button class="alt" id="dec">Decifrar</button></div>
<div class="big" id="out" style="font-family:monospace;letter-spacing:2px"></div>
<svg id="sv" viewBox="0 0 400 130" style="background:#0E2354;border-radius:10px"></svg></div>
<div class="card"><h2>Quebre sem a chave</h2><p class="muted">Esta mensagem foi cifrada com o rotor numa posição secreta. Teste posições até aparecer português.</p>
<div class="big" id="seg" style="font-family:monospace"></div><label class="lbl">Tentar posição: <span id="vt"></span></label><div class="sl"><input type="range" id="tr" min="0" max="25" value="0"></div><div class="out" id="tenta"></div><div class="msg" id="fb" style="display:none"></div></div>
<script>
const $=i=>document.getElementById(i);const AB='ABCDEFGHIJKLMNOPQRSTUVWXYZ',W='EKMFLGDQVZNTOWYHXUSPAIBRCJ';const IW=AB.split('').map((_,i)=>AB[W.indexOf(AB[i])]).join('');
$('p').innerHTML=AB.split('').map((c,i)=>`<option value="${i}">${c}</option>`).join('');
function proc(txt,p,dec){let s='',pos=p,last=null;for(const ch of txt.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'')){const i=AB.indexOf(ch);if(i<0){s+=ch;continue}pos=(pos+1)%26;
 const o=dec?(AB.indexOf(IW[(i+pos)%26])-pos+26)%26:(AB.indexOf(W[(i+pos)%26])-pos+26)%26;s+=AB[o];last=[i,o,pos]}return[s,last]}
function anel(last){let s='';for(let i=0;i<26;i++){const x=12+i*14.6;s+=`<text x="${x}" y="25" font-size="11" fill="${last&&last[0]==i?'#F78D33':'#FDE9D8'}" text-anchor="middle" font-family="monospace">${AB[i]}</text><text x="${x}" y="115" font-size="11" fill="${last&&last[1]==i?'#F78D33':'#FDE9D8'}" text-anchor="middle" font-family="monospace">${AB[i]}</text>`}
 if(last){const x1=12+last[0]*14.6,x2=12+last[1]*14.6;s+=`<path d="M${x1} 32 C${x1} 70 ${x2} 60 ${x2} 102" stroke="#F78D33" stroke-width="3" fill="none"/>`}
 s+=`<text x="200" y="70" font-size="11" fill="#9CA3AF" text-anchor="middle">rotor na posição ${last?AB[last[2]]:'-'}</text>`;$('sv').innerHTML=s}
function go(dec){const[r,last]=proc($('t').value,+$('p').value,dec);$('out').textContent=r;anel(last)}
$('cif').onclick=()=>go(false);$('dec').onclick=()=>go(true);go(false);
const MSGS=['A MATEMATICA VENCEU A GUERRA','O SEGREDO ESTA NO ROTOR','REJEWSKI CHEGOU PRIMEIRO'];const sec=Math.floor(Math.random()*26),pl=MSGS[Math.floor(Math.random()*MSGS.length)];const C=proc(pl,sec,false)[0];$('seg').textContent=C;
function tenta(){const k=+$('tr').value;$('vt').textContent=AB[k];const r=proc(C,k,true)[0];$('tenta').textContent=r;const ok=r==pl;$('fb').style.display=ok?'block':'none';$('fb').className='msg ok';$('fb').innerHTML='<b>Quebrou!</b> A posição era '+AB[k]+'. Com 3 rotores seriam 17 576 posições, e a Enigma ainda tinha o painel de tomadas.'}
$('tr').oninput=tenta;tenta();
</script>
