<!--T: Supermercado da inflação-->
<div class="card"><h2>O preço que sobe todo dia</h2><p class="muted">Ana recebe o salário em dinheiro vivo. Bruno deixa o salário numa aplicação de rendimento diário (como o overnight dos bancos), que acompanha a inflação. Os dois recebem 1 000 no dia 1.</p>
<label class="lbl">Inflação do mês: <span id="vi"></span>%</label><div class="sl"><input type="range" id="i" min="0" max="80" step="0.5" value="47.5"></div>
<label class="lbl">Dia das compras: <span id="vd"></span></label><div class="sl"><input type="range" id="d" min="1" max="30" value="15"></div>
<label style="display:flex;gap:6px;align-items:center;margin:6px 0"><input type="checkbox" id="u" style="width:auto"> preços em URV (unidade estável)</label>
<svg id="sv" viewBox="0 0 400 220" style="background:#fff;border-radius:10px"></svg><div class="out" id="out"></div></div>
<script>
const $=i=>document.getElementById(i);const IT=[['arroz',20],['feijão',15],['leite',12],['pão',8],['carne',45]];const CESTA=IT.reduce((a,b)=>a+b[1],0);
function draw(){const im=+$('i').value/100,d=+$('d').value,u=$('u').checked;$('vi').textContent=(im*100).toLocaleString('pt-BR');$('vd').textContent=d;
 const fd=Math.pow(1+im,(d-1)/30);const preco=u?1:fd;let s='';
 IT.forEach(([n,p],k)=>{const v=p*preco,h=Math.min(150,v*1.4);const x=20+k*42;s+=`<rect x="${x}" y="${190-h}" width="30" height="${h}" fill="#F78D33"/><text x="${x+15}" y="205" font-size="10" text-anchor="middle" fill="#0E2354">${n}</text><text x="${x+15}" y="${184-h}" font-size="9" text-anchor="middle" fill="#6B7280">${Math.round(v)}</text>`});
 const ana=1000/(CESTA*preco),bru=1000*(u?1:fd)/(CESTA*preco);
 const bar=(y,nome,c,cor)=>{const w=Math.min(155,c*15);return `<text x="235" y="${y-6}" font-size="11" fill="#0E2354" font-weight="700">${nome}: ${c.toLocaleString('pt-BR',{maximumFractionDigits:1})} cestas</text><rect x="235" y="${y}" width="${w}" height="18" fill="${cor}"/>`};
 s+=bar(70,'Ana (dinheiro vivo)',ana,'#B91C1C')+bar(130,'Bruno (aplicação)',bru,'#0F766E');$('sv').innerHTML=s;
 $('out').innerHTML=u?'Com os preços em URV, a cesta custa o mesmo todos os dias: ninguém precisa correr ao mercado.':`No dia ${d}, os preços já subiram <b>${((fd-1)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}%</b>. Ana compra <b>${(100/fd).toLocaleString('pt-BR',{maximumFractionDigits:0})}%</b> do que compraria no dia 1. Quem não tinha conta em banco era quem mais perdia.`;}
['i','d'].forEach(k=>$(k).oninput=draw);$('u').onchange=draw;draw();
</script>
