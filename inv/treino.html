<header><div class="brand">Didati<b>Click</b> · A Matemática de um Inverno sem Fim</div><h1>Pratique</h1></header>
<main>

<div class="card"><h2 id="mt">Exercícios sorteados</h2><p class="muted" style="margin-top:0">Cada vez que você aperta <b>Outro exercício</b>, um problema novo é sorteado. Responda, confira e veja a explicação.</p>
<div id="mods" style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px"></div>
<div id="q" style="font-size:17px;line-height:1.5;margin:8px 0"></div>
<div id="resp"></div>

<div class="row" style="margin-top:10px"><button id="conf">Conferir</button><button class="alt" id="novo">Outro exercício</button></div>

<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
(()=>{
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const LIV={'inv1':{T:["O que é uma onda", "Velocidade, frequência e comprimento", "Ondas P e ondas S", "A distância pelo atraso", "Três estações: o epicentro", "Prédios que balançam: ressonância"],G:{1:()=>{const t=R(0,2);
 if(t==0){const T=P([0.1,0.2,0.25,0.5,2,4,5,8]);return{q:`Uma onda tem período <b>${fmt(T)} s</b>. Qual a frequência, em Hz?`,a:Math.round(1/T*1000)/1000,tol:0.01,exp:`f = 1 ÷ T = 1 ÷ ${fmt(T)} = ${fmt(Math.round(1/T*1000)/1000)} Hz.`};}
 if(t==1){const n=P([6,8,10,12,20,30]),s=P([2,3,4,5,10]);return{q:`Um ponto faz <b>${n} oscilações</b> em <b>${s} s</b>. Qual a frequência?`,a:Math.round(n/s*100)/100,tol:0.01,exp:`${n} ÷ ${s} = ${fmt(Math.round(n/s*100)/100)} Hz.`};}
 const c=R(3,8),L=P([2,3,4,5])*(c-1);return{q:`Numa foto há <b>${c} cristas</b> seguidas, e da primeira à última são <b>${L} m</b>. Qual o comprimento de onda?`,a:L/(c-1),exp:`${c} cristas formam ${c-1} espaços: ${L} ÷ ${c-1} = ${fmt(L/(c-1))} m.`};},
2:()=>{const t=R(0,2);
 if(t==0){const l=P([0.5,1,2,3,4]),f=P([2,4,5,10,20]);return{q:`Uma onda tem λ = <b>${fmt(l)} m</b> e f = <b>${f} Hz</b>. Qual a velocidade, em m/s?`,a:l*f,exp:`v = λ · f = ${fmt(l)} × ${f} = ${fmt(l*f)} m/s.`};}
 if(t==1){const f=P([85,170,340,680,1700]);return{q:`O som anda a 340 m/s no ar. Qual o comprimento de onda de um som de <b>${f} Hz</b>, em metros?`,a:340/f,tol:0.005,exp:`λ = 340 ÷ ${f} = ${fmt(Math.round(340/f*1000)/1000)} m.`};}
 const v=P([3,6]),f=P([1,2,3,4,5]);return{q:`Na rocha, uma onda anda a <b>${v} km/s</b> com frequência de <b>${f} Hz</b>. Qual o comprimento de onda, em km?`,a:Math.round(v/f*1000)/1000,tol:0.005,exp:`λ = ${v} ÷ ${f} = ${fmt(Math.round(v/f*1000)/1000)} km.`};},
3:()=>{const t=R(0,2);
 if(t==0){const d=P([12,18,24,30,36,42,48,60]);return{q:`Um tremor a <b>${d} km</b>. Em quantos segundos chega a onda P (6 km/s)?`,a:d/6,exp:`${d} ÷ 6 = ${fmt(d/6)} s.`};}
 if(t==1){const d=P([7,14,21,28,35,42,70]);return{q:`Um tremor a <b>${d} km</b>. Em quantos segundos chega a onda S (3,5 km/s)?`,a:d/3.5,exp:`${d} ÷ 3,5 = ${fmt(d/3.5)} s.`};}
 return P([{q:'A onda S atravessa líquidos?',opts:['sim','não'],a:'não',exp:'Ela é transversal; o líquido não resiste a ser entortado.'},{q:'Qual onda chega primeiro a uma estação?',opts:['P','S'],a:'P',exp:'A P é mais rápida (cerca de 6 km/s).'},{q:'A onda P é:',opts:['longitudinal','transversal'],a:'longitudinal',exp:'Ela comprime e estica a rocha.'}]);},
4:()=>{const t=R(0,2);
 if(t==0){const a=P([1,2,2.5,3,4,5,6,7.5,10]);return{q:`O atraso S − P foi de <b>${fmt(a)} s</b>. A que distância foi o tremor, em km? (use 8,4 km por segundo)`,a:Math.round(a*8.4*100)/100,tol:0.05,exp:`${fmt(a)} × 8,4 = ${fmt(Math.round(a*8.4*100)/100)} km.`};}
 if(t==1){const d=P([21,42,63,84,105]);return{q:`Um tremor a <b>${d} km</b>. Qual o atraso S − P, em segundos?`,a:d/8.4,tol:0.01,exp:`${d} ÷ 3,5 − ${d} ÷ 6 = ${fmt(d/3.5)} − ${fmt(Math.round(d/6*100)/100)} = ${fmt(d/8.4)} s.`};}
 const a=P([2,3,4,5]),k=P([2,3]);return{q:`O atraso passou de <b>${a} s</b> para <b>${a*k} s</b>. A distância ficou quantas vezes maior?`,a:k,exp:`A distância é proporcional ao atraso: ${k} vezes.`};},
5:()=>{const t=R(0,2);const TR=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20]];
 if(t==0){const [a,b,c]=P(TR);return{q:`Qual a distância entre os pontos (0, 0) e (<b>${a}</b>, <b>${b}</b>)?`,a:c,exp:`√(${a}² + ${b}²) = √${a*a+b*b} = ${c}.`};}
 if(t==1){const [e,h,D]=P(TR);return{q:`O hipocentro está a <b>D = ${D} km</b> da estação, e o epicentro a <b>${e} km</b> dela. Qual a profundidade, em km?`,a:h,exp:`h² = ${D}² − ${e}² = ${D*D-e*e}; h = ${h} km.`};}
 const [e,h,D]=P(TR);return{q:`Profundidade de <b>${h} km</b> e epicentro a <b>${e} km</b> da estação. Qual a distância D até o hipocentro?`,a:D,exp:`D = √(${h}² + ${e}²) = √${D*D} = ${D} km.`};},
6:()=>{const t=R(0,2);
 if(t==0){const n=P([2,4,5,8,10,15,20,25,30]);return{q:`Pela regra T ≈ 0,1 · N, qual o período natural de um prédio de <b>${n} andares</b>, em segundos?`,a:n/10,exp:`0,1 × ${n} = ${fmt(n/10)} s.`};}
 if(t==1){const n=P([2,4,5,8,10,20,25]);return{q:`Qual a frequência natural (em Hz) de um prédio de <b>${n} andares</b>? (T ≈ 0,1 · N)`,a:Math.round(10/n*100)/100,tol:0.01,exp:`T = ${fmt(n/10)} s; f = 1 ÷ ${fmt(n/10)} = ${fmt(Math.round(10/n*100)/100)} Hz.`};}
 const f=P([0.5,1,2,2.5,5]);return{q:`O chão vibra a <b>${fmt(f)} Hz</b>. Quantos andares tem o prédio que entra em ressonância? (T ≈ 0,1 · N)`,a:10/f,exp:`T = 1 ÷ ${fmt(f)} = ${fmt(1/f)} s; N = ${fmt(1/f)} ÷ 0,1 = ${fmt(10/f)} andares.`};}}},'inv2':{T:["Números gigantes: notação científica", "Cada degrau, vezes 10", "O logaritmo: contar os zeros", "A escala VEI das erupções", "Magnitude e energia dos tremores", "O estrondo: decibéis", "Tambora, Pinatubo e o Monte Brasa"],G:{1:()=>{const t=R(0,3);const SP=n=>String(n).split('').map(c=>({'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'})[c]).join('');
 if(t==0){const a=P([2,3,4,5,6,7,8,9]),e=R(5,12);return{q:`Escreva ${a}${'0'.repeat(e)} em notação científica. Qual é o expoente do 10?`,a:e,exp:`${a}${'0'.repeat(e)} = ${a} × 10${SP(e)}: a vírgula andou ${e} casas.`};}
 if(t==1){const k=P([2,3,5,7,12,40,120]);return{q:`Quantos metros cúbicos há em <b>${k} km³</b>? Responda só o expoente n de 10ⁿ, sabendo que a resposta é ${k} × 10ⁿ.`,a:9,exp:`1 km³ = (10³ m)³ = 10⁹ m³, então ${k} km³ = ${k} × 10⁹ m³.`};}
 if(t==2){const a=R(2,4),b=R(2,2),e1=R(3,8),e2=R(2,7);return{q:`Calcule (${a} × 10${SP(e1)}) × (${b} × 10${SP(e2)}). O resultado é ${a*b} × 10ⁿ. Quanto vale n?`,a:e1+e2,exp:`Multiplique os números da frente (${a} × ${b} = ${a*b}) e some os expoentes: ${e1} + ${e2} = ${e1+e2}.`};}
 const [a,b]=P([[6,2],[6,3],[8,2],[9,3],[8,4]]),e1=R(9,14),e2=R(2,6);return{q:`Calcule (${a} × 10${SP(e1)}) ÷ (${b} × 10${SP(e2)}). O resultado é ${fmt(a/b)} × 10ⁿ. Quanto vale n?`,a:e1-e2,exp:`Divida os números da frente e subtraia os expoentes: ${e1} − ${e2} = ${e1-e2}.`};},
2:()=>{const t=R(0,2);
 if(t==0){const a=R(-2,3),b=a+R(1,5);return{q:`Quantos degraus de ×10 há entre <b>${fmt(Math.pow(10,a))}</b> e <b>${fmt(Math.pow(10,b))}</b>?`,a:b-a,exp:`${fmt(Math.pow(10,b))} ÷ ${fmt(Math.pow(10,a))} = 10^${b-a}: ${b-a} degraus.`};}
 if(t==1){const n=R(1,5);return{q:`Subir <b>${n}</b> degrau(s) numa escala de ×10 multiplica por quanto?`,a:Math.pow(10,n),exp:`10^${n} = ${fmt(Math.pow(10,n))}.`};}
 const c=P([3,4,5,6]),d=R(1,3);return{q:`Numa régua log, a distância entre 1 e 10 é <b>${c} cm</b>. Qual a distância entre 1 e ${fmt(Math.pow(10,d))}, em cm?`,a:c*d,exp:`São ${d} degraus de ${c} cm: ${c*d} cm.`};},
3:()=>{const t=R(0,3);
 if(t==0){const e=R(-3,8);return{q:`Calcule log ${fmt(Math.pow(10,e))}.`,a:e,exp:`10 elevado a ${e} dá ${fmt(Math.pow(10,e))}.`};}
 if(t==1){const n=P([[20,'log 2 + log 10 = 0,30 + 1',1.3],[200,'log 2 + log 100 = 0,30 + 2',2.3],[8,'3 × log 2 = 3 × 0,30',0.9],[16,'4 × log 2 = 4 × 0,30',1.2],[0.5,'log 1 − log 2 = −0,30',-0.3],[4,'2 × log 2',0.6],[2000,'log 2 + 3',3.3]]);return{q:`Usando log 2 ≈ 0,30, calcule log ${fmt(n[0])}.`,a:n[2],tol:0.011,exp:`${n[1]} = ${fmt(n[2])}.`};}
 if(t==2){const n=P([[6,'log 2 + log 3 = 0,30 + 0,48',0.78],[15,'log 3 + log 5 = 0,48 + 0,70',1.18],[30,'log 3 + 1',1.48],[9,'2 × log 3',0.96],[50,'log 5 + 1',1.7],[0.3,'log 3 − 1',-0.52]]);return{q:`Use log 2 ≈ 0,30, log 3 ≈ 0,48 e log 5 ≈ 0,70 para calcular log ${fmt(n[0])}.`,a:n[2],tol:0.011,exp:`${n[1]} = ${fmt(n[2])}.`};}
 const e=R(1,6),m=P([2,3,5]);const v=m*Math.pow(10,e);return{q:`log ${fmt(v)} fica entre quais inteiros? Responda o <b>menor</b> deles.`,a:e,exp:`${fmt(v)} está entre 10^${e} e 10^${e+1}, então log ${fmt(v)} fica entre ${e} e ${e+1}.`};},
4:()=>{const t=R(0,2);const SP=n=>String(n).split('').map(c=>({'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'})[c]).join('');
 if(t==0){const a=P([1.5,2,3,4,5,7,9]),e=R(6,12);return{q:`Uma erupção expeliu <b>${fmt(a)} × 10${SP(e)} m³</b>. Qual a nota VEI?`,a:e-4,exp:`Parte inteira de log V = ${e}; ${e} − 4 = VEI ${e-4}.`};}
 if(t==1){const a=R(2,6),b=a+R(1,2);return{q:`Quantas vezes o volume mínimo de uma erupção de VEI ${b} é maior que o de uma de VEI ${a}?`,a:Math.pow(10,b-a),exp:`${b-a} degrau(s): 10^${b-a} = ${fmt(Math.pow(10,b-a))}.`};}
 const n=P([[0.05,3],[0.5,4],[2.5,5],[30,6],[120,7],[0.002,2]]);return{q:`Uma erupção expeliu <b>${fmt(n[0])} km³</b>. Qual a nota VEI?`,a:n[1],exp:`${fmt(n[0])} km³ = ${fmt(n[0])} × 10⁹ m³; a parte inteira do log é ${n[1]+4}; ${n[1]+4} − 4 = ${n[1]}.`};},
5:()=>{const t=R(0,2);
 if(t==0){const d=R(1,4);return{q:`Dois tremores diferem em <b>${d}</b> ponto(s) de magnitude. Quantas vezes maior é a amplitude no sismograma?`,a:Math.pow(10,d),exp:`10^${d} = ${fmt(Math.pow(10,d))}.`};}
 if(t==1){const d=P([2,4]);return{q:`Dois tremores diferem em <b>${d}</b> pontos de magnitude. Quantas vezes maior é a energia?`,a:Math.pow(10,1.5*d),exp:`10^(1,5 × ${d}) = 10^${1.5*d} = ${fmt(Math.pow(10,1.5*d))}.`};}
 const M=P([4,5,6,7,8]);return{q:`Pela fórmula log E = 4,8 + 1,5 · M, quanto vale log E para um tremor de magnitude <b>${M}</b>?`,a:Math.round((4.8+1.5*M)*10)/10,tol:0.01,exp:`4,8 + 1,5 × ${M} = ${fmt(Math.round((4.8+1.5*M)*10)/10)}, ou seja, E = 10^${fmt(Math.round((4.8+1.5*M)*10)/10)} J.`};},
6:()=>{const t=R(0,3);const SP=n=>String(n).split('').map(c=>({'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'})[c]).join('');
 if(t==0){const e=R(-11,1);return{q:`Um som tem intensidade <b>10${SP(e)} W/m²</b>. Qual o nível em dB? (I₀ = 10⁻¹² W/m²)`,a:10*(e+12),exp:`10 · log (10${SP(e)} ÷ 10⁻¹²) = 10 · ${e+12} = ${10*(e+12)} dB.`};}
 if(t==1){const a=R(3,9)*10,d=P([10,20,30]);return{q:`Um som passou de <b>${a} dB</b> para <b>${a+d} dB</b>. A intensidade ficou quantas vezes maior?`,a:Math.pow(10,d/10),exp:`${d} dB = ${d/10} degrau(s) de ×10: ${fmt(Math.pow(10,d/10))} vezes.`};}
 if(t==2){const L=R(8,12)*10,k=P([2,4,10]);const q=k==2?6:k==4?12:20;return{q:`A 10 m de uma caixa de som o nível é <b>${L} dB</b>. Qual o nível a <b>${10*k} m</b>, aproximadamente?`,a:L-q,tol:0.6,exp:`Distância ×${k}: queda de 20 · log ${k} ≈ ${q} dB. ${L} − ${q} = ${L-q} dB.`};}
 const f=P([110,220,440,55]),n=R(1,3);return{q:`Uma nota de <b>${f} Hz</b> sobe <b>${n}</b> oitava(s). Qual a nova frequência, em Hz?`,a:f*Math.pow(2,n),exp:`Cada oitava dobra: ${f} × 2^${n} = ${f*Math.pow(2,n)} Hz.`};},
7:()=>{const t=R(0,2);const E=[['Santa Helena',1.2],['Pinatubo',10],['Krakatoa',20],['Tambora',150],['Yellowstone',2500]];
 if(t==0){const [n,v]=P(E.slice(0,3));return{q:`O Monte Brasa expeliu 120 km³. Quantas vezes o volume do <b>${n}</b> (${fmt(v)} km³)?`,a:120/v,tol:0.05,exp:`120 ÷ ${fmt(v)} = ${fmt(Math.round(120/v*100)/100)}.`};}
 if(t==1){const d=R(1,4);return{q:`Num gráfico com eixo logarítmico, a barra A fica <b>${d}</b> linha(s) de grade acima da barra B. Quantas vezes A é maior que B?`,a:Math.pow(10,d),exp:`Cada linha é ×10: 10^${d} = ${fmt(Math.pow(10,d))}.`};}
 const d=P([[0.3,2],[0.48,3],[0.7,5],[1.3,20],[2,100]]);return{q:`A diferença entre os logaritmos dos volumes de duas erupções é <b>${fmt(d[0])}</b>. Quantas vezes uma é maior que a outra, aproximadamente?`,a:d[1],tol:0.1,exp:`10^${fmt(d[0])} ≈ ${d[1]}.`};}}}};
const qs=new URLSearchParams(location.search);let l=qs.get('l');if(!LIV[l])l='inv1';const {T,G}=LIV[l];
let m=+(qs.get('m'))||1;if(!G[m])m=1;let cur,ok=0,tot=0,feito=false,esc=null;
function mods(){$('mods').innerHTML=T.map((t,i)=>`<button class="${i+1==m?'':'alt'}" style="padding:4px 10px;font-size:13px" title="${t}" data-m="${i+1}">${i+1}</button>`).join('');
 document.querySelectorAll('#mods button').forEach(b=>b.onclick=()=>{m=+b.dataset.m;history.replaceState(null,'','?l='+l+'&m='+m);mods();novo();});}
function novo(){cur=G[m]();feito=false;esc=null;$('mt').textContent='Módulo '+m+' · '+T[m-1];$('q').innerHTML=cur.q;$('fb').style.display='none';
 $('resp').innerHTML=cur.opts?cur.opts.map(o=>`<button class="alt opt" style="margin:3px">${o}</button>`).join(''):'<input type="text" inputmode="decimal" id="r" placeholder="sua resposta" style="font-size:16px;padding:8px;border:2px solid #D7DEEA;border-radius:10px;width:100%;box-sizing:border-box">';
 if(cur.opts)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{esc=b.textContent;document.querySelectorAll('.opt').forEach(x=>x.className='alt opt');b.className='opt';});
 else $('r').onkeydown=e=>{if(e.key=='Enter')conf();};}
function conf(){if(feito)return;let v=cur.opts?esc:($('r').value.trim());if(v===null||v==='')return;
 const certo=cur.opts?v==cur.a:Math.abs(+v.replace(',','.').replace('−','-')-cur.a)<=(cur.tol||0.001);
 feito=true;tot++;if(certo)ok++;$('fb').style.display='block';$('fb').className='msg '+(certo?'ok':'bad');$('fb').innerHTML=(certo?'<b>Certo!</b> ':'<b>Ainda não.</b> A resposta é <b>'+(typeof cur.a=='number'?fmt(cur.a):cur.a)+'</b>. ')+cur.exp;
 $('placar').textContent=`Acertos nesta visita: ${ok} de ${tot}`;}
$('conf').onclick=conf;$('novo').onclick=novo;mods();novo();
})();
</script>
