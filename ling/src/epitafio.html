<!--T: O epitáfio de Diofanto-->
<div class="card"><h2>A régua da vida</h2><p class="muted">Infância: 1/6 da vida. Juventude: mais 1/12. Casamento depois de mais 1/7. Filho 5 anos depois. O filho viveu 1/2 da vida do pai. O pai viveu mais 4 anos. Arraste a idade até a régua fechar.</p>
<div class="sl"><span>Idade</span><input type="range" id="a" min="12" max="120" value="60"><b id="av"></b></div>
<svg id="s" viewBox="0 0 320 70" style="width:100%"></svg><div id="m"></div></div>
<script>
const $=i=>document.getElementById(i);
function draw(){const x=+$('a').value;$('av').textContent=x+' anos';const p=[[x/6,'infância','#0E2354'],[x/12,'juventude','#2457D6'],[x/7,'até casar','#F7821F'],[5,'até o filho','#C2410C'],[x/2,'vida do filho','#15803D'],[4,'luto','#6B7280']];
 const tot=p.reduce((s,q)=>s+q[0],0);let X=0,s='';const k=300/Math.max(tot,x);
 for(const [v,n,c] of p){s+=`<rect x="${10+X*k}" y="10" width="${v*k}" height="26" fill="${c}" stroke="#fff"/>`;X+=v;}
 s+=`<line x1="${10+x*k}" y1="4" x2="${10+x*k}" y2="44" stroke="#B91C1C" stroke-width="2"/><text x="${10+x*k}" y="58" text-anchor="middle" font-size="11" fill="#B91C1C">fim da vida (${x})</text>`;$('s').innerHTML=s;
 const inteiros=[6,12,7,2].every(d=>x%d==0),ok=Math.abs(tot-x)<1e-9;
 $('m').innerHTML=`<div class="msg ${ok?'ok':'info'}">Soma dos pedaços: ${tot.toFixed(2).replace('.',',')} anos. ${ok?'Fechou! Diofanto teria vivido '+x+' anos.':(tot>x?'Os pedaços passam da vida: diminua a idade.':'Faltam anos na régua: aumente a idade.')}${inteiros&&!ok?' (Todos os pedaços são inteiros, mas a soma ainda não bate.)':''}</div>`;}
$('a').oninput=draw;draw();
</script>
