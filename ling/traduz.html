<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tradutor de enunciados · DidatiClick</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
input[type=text],input[type=number],textarea,select{font-family:inherit;font-size:16px;border:2px solid #D7DEEA;border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{min-height:120px}
.big{font-size:28px;font-weight:700;color:var(--navy);text-align:center;margin:8px 0;word-break:break-word}
.tag{display:inline-block;background:var(--peach);color:var(--navy);border-radius:8px;padding:2px 8px;margin:2px;font-size:13px}
table.t{border-collapse:collapse;width:100%;font-size:14px}table.t td,table.t th{border-bottom:1px solid #E5E7EB;padding:5px 6px;text-align:left}table.t th{background:var(--navy);color:#fff}
.bar{height:14px;background:var(--orange);border-radius:4px}
.sl{display:flex;align-items:center;gap:10px;margin:8px 0}.sl input{flex:1}
.lbl{font-weight:600;color:var(--navy);font-size:14px;margin-top:8px;display:block}
</style>
</head>
<body>
<header><div class="brand">Didati<b>Click</b> · Matemática e Linguagens</div><h1 id="title">Tradutor de enunciados</h1></header>
<main>
<div class="card"><h2>Qual é a equação?</h2><p class="muted">Leia a frase e escolha a tradução certa. Dica: teste com números!</p><div class="placar muted" id="pl"></div>
<div id="fr" class="msg info" style="font-size:16px"></div><div id="ops"></div><div id="m"></div></div>
</main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
const $=i=>document.getElementById(i);
const Q=[['Há seis vezes mais alunos (A) do que professores (P).',['A = 6P','6A = P','A + 6 = P','A = P + 6'],'Teste: 10 professores → 60 alunos. Só A = 6P dá 60 = 6 × 10. A armadilha 6A = P segue a ordem das palavras.'],
['Ana (A) tem 5 anos a mais que Bia (B).',['A = B + 5','B = A + 5','A = 5B','A + B = 5'],'Se Bia tem 10, Ana tem 15: 15 = 10 + 5.'],
['O triplo da soma de um número com 4 é 30.',['3(x + 4) = 30','3x + 4 = 30','x + 12 = 3','3 + x + 4 = 30'],'Primeiro a soma (x + 4), depois o triplo.'],
['A soma do triplo de um número com 4 é 30.',['3x + 4 = 30','3(x + 4) = 30','4x + 3 = 30','x + 4 = 90'],'Primeiro o triplo (3x), depois soma 4.'],
['Pedro (P) tem 3 anos a menos que Clara (C).',['P = C − 3','C = P − 3','P − C = 3','3P = C'],'Se Clara tem 10, Pedro tem 7: 7 = 10 − 3.'],
['Três números consecutivos somam 45.',['n + (n + 1) + (n + 2) = 45','3n = 45 + 3','n + 2n + 3n = 45','n + 1 + 2 = 45'],'Consecutivos: cada um é o anterior mais 1.'],
['A diferença entre 20 e um número é 8.',['20 − x = 8','x − 20 = 8','20 + x = 8','8 − x = 20'],'"A diferença entre 20 e x" começa pelo 20.'],
['Um quadrado e dez raízes são iguais a trinta e nove.',['x² + 10x = 39','10x² = 39','x + 10 = 39','x² = 10x + 39'],'É a frase de al-Khwarizmi: quadrado = x², raiz = x.'],
['Daqui a 5 anos terei o dobro da idade que tinha há 5 anos.',['x + 5 = 2(x − 5)','x + 5 = 2x − 5','2(x + 5) = x − 5','x − 5 = 2(x + 5)'],'"O dobro da idade que tinha" pede parênteses: 2(x − 5).'],
['Há quatro vezes mais galinhas (G) do que vacas (V).',['G = 4V','4G = V','G + 4 = V','V = 4G'],'Com 5 vacas, 20 galinhas: 20 = 4 × 5.']];
const AZ='#0E2354',LA='#F7821F',VE='#2E7D4F',CI='#9CA3AF';
const B=[[['P',[['P',1,AZ]]],['A',[['P',1,LA],['P',1,LA],['P',1,LA],['P',1,LA],['P',1,LA],['P',1,LA]]]],
[['B',[['B',3,AZ]]],['A',[['B',3,LA],['5',1,VE]]]],
[['30',[['x',2,AZ],['4',1,VE],['x',2,AZ],['4',1,VE],['x',2,AZ],['4',1,VE]]]],
[['30',[['x',2,AZ],['x',2,AZ],['x',2,AZ],['4',1,VE]]]],
[['C',[['P',3,AZ],['3',1,VE]]],['P',[['P',3,LA]]]],
[['45',[['n',2,AZ],['n',2,AZ],['1',.6,VE],['n',2,AZ],['1',.6,VE],['1',.6,VE]]]],
[['20',[['x',2.4,AZ],['8',2,VE]]]],
[['39',[['x²',3,AZ],['10x',4,LA]]]],
[['hoje + 5',[['x',4,AZ],['5',1,VE]]],['2 × (hoje − 5)',[['x − 5',2.6,LA],['x − 5',2.6,LA]]]],
[['V',[['V',1,AZ]]],['G',[['V',1,LA],['V',1,LA],['V',1,LA],['V',1,LA]]]]];
function barras(i){const L=B[i];let h='',y=8;const tot=Math.max(...L.map(r=>r[1].reduce((a,b)=>a+b[1],0))),k=Math.min(46,250/tot);
 for(const [nome,seg] of L){let x=70;h+=`<text x="64" y="${y+20}" text-anchor="end" font-size="12" font-weight="700" fill="${AZ}">${nome}</text>`;
  for(const [t,u,c] of seg){h+=`<rect x="${x}" y="${y}" width="${u*k-2}" height="30" rx="5" fill="${c}"/><text x="${x+(u*k-2)/2}" y="${y+20}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${t}</text>`;x+=u*k;}
  y+=40;}
 return `<p class="lbl">Em barras (cada bloco é um pedaço da frase):</p><svg viewBox="0 0 330 ${y}" style="width:100%">${h}</svg>`;}
let ord=Q.map((_,i)=>i).sort(()=>Math.random()-.5),k=0,ac=0;
function show(){const q=Q[ord[k%Q.length]];$('fr').textContent=q[0];$('m').innerHTML='';const o=q[1].map((t,i)=>[t,i]).sort(()=>Math.random()-.5);
 $('ops').innerHTML='';o.forEach(([t,i])=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if($('m').innerHTML)return;const ok=i==0;if(ok)ac++;b.classList.add(ok?'right':'wrong');
  [...$('ops').children].forEach(x=>{if(x.textContent==q[1][0])x.classList.add('right');});$('m').innerHTML=`<div class="msg ${ok?'ok':'bad'}">${ok?'Certo!':'Cuidado com a armadilha.'} ${q[2]}</div>${barras(ord[k%Q.length])}<button class="or" style="margin-top:8px" id="nx">Próxima</button>`;$('nx').onclick=()=>{k++;show();};$('pl').textContent=`Acertos: ${ac} de ${k+1}`;};$('ops').appendChild(b);});}
show();
</script>

</body>
</html>
