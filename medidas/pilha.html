<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A pilha de papel · DidatiClick</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
svg{max-width:100%;height:auto}
.fig{background:#fff;border:2px dashed #D7DEEA;border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.tabs button.on{background:var(--navy);color:#fff}
.sl{display:grid;grid-template-columns:120px 1fr 70px;align-items:center;gap:8px;margin:8px 0}
.sl b{color:var(--navy)}.sl span{font-weight:700;color:var(--orange);text-align:right}
.res{font-size:18px;font-weight:600;color:var(--navy);margin:6px 0;line-height:1.7}
.res .k{color:var(--orange)}.res .g{color:var(--ok)}.res .z{color:#fff;background:var(--orange);border-radius:4px;padding:0 2px}
.placar{font-weight:700;color:var(--navy);text-align:right;font-size:14px}
.hide{display:none!important}
input.n{font-family:inherit;font-size:20px;width:120px;padding:6px 8px;border:2px solid #D7DEEA;border-radius:10px;text-align:center}
input.s{width:70px}
select{font-family:inherit;font-size:16px;padding:6px 8px;border:2px solid #D7DEEA;border-radius:10px;background:#fff}
.dq{font-size:20px;font-weight:600;color:var(--navy);line-height:2.1}
.pesos button{min-width:70px}
</style>
<script src="um.js"></script>
</head>
<body>
<header><div class="brand">Didati<b>Click</b> · Unidades de medida</div><h1 id="title">A pilha de papel</h1></header>
<main>

<div class="card">
<p class="muted">Cada folha tem 0,1 mm de espessura. Mexa no controle e veja a pilha crescer ao lado da régua. Um pacote (resma) tem 500 folhas.</p>
<div class="sl" id="pn"><b>Folhas</b><input type="range"><span></span></div>
<div class="row" style="margin:4px 0 8px"><button class="alt" id="m1">− 1 pacote</button><button class="alt" id="p1">+ 1 pacote</button></div>
<div class="fig" id="pf"></div><div class="res" id="pr"></div></div>
<div class="card"><div class="placar" id="placar">Acertos: 0 de 0</div><h3 style="margin:0 0 6px;color:var(--navy)">Desafio</h3>
<div class="dq" id="dq"></div><div class="row"><button class="or" id="ok">OK</button><button class="alt" id="novo">Outra pergunta</button></div><div id="dm"></div></div>

</main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
const $=i=>document.getElementById(i);const q=new URLSearchParams(location.search);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const pick=a=>a[rnd(0,a.length-1)];
const F=UM.fmt;
const W=()=>Math.max(280,Math.min(560,innerWidth-70));
function msg(id,t,c){$(id).innerHTML=t?`<div class="msg ${c||'info'}">${t}</div>`:'';}
function tabs(ids,cb){ids.forEach(t=>{$('tab-'+t).onclick=()=>{ids.forEach(u=>{$('tab-'+u).classList.toggle('on',u===t);$('pn-'+u).classList.toggle('hide',u!==t);});cb&&cb(t);};});}
function slider(id,v,lo,hi,cb,show){const el=$(id);const i=el.querySelector('input'),s=el.querySelector('span');i.min=lo;i.max=hi;i.step=1;i.value=v;
 const sh=()=>{s.textContent=show?show(+i.value):i.value;};sh();i.oninput=()=>{sh();cb(+i.value);};return {get:()=>+i.value,set:x=>{i.value=x;sh();}};}
const num=s=>{s=String(s).trim().replace(/\s/g,'').replace('−','-');if(/,.*\./.test(s)||(s.match(/,/g)||[]).length>1)return NaN;s=s.replace(',','.');return s===''?NaN:Number(s);};
let ac=0,tt=0;function placar(ok){tt++;if(ok)ac++;$('placar').textContent=`Acertos: ${ac} de ${tt}`;}
// desafio genérico: gerar() devolve {html, res:[números], exp, tol}; só conta depois do OK
function desafio(gerar){let cur,feito=false;
 function novo(){cur=gerar();feito=false;$('dq').innerHTML=cur.html;msg('dm','');$('ok').disabled=false;
  const ins=[...document.querySelectorAll('#dq input')];if(ins[0])ins[0].focus();
  ins.forEach(x=>x.onkeydown=e=>{if(e.key==='Enter')$('ok').click();});}
 $('ok').onclick=()=>{if(feito)return;const ins=[...document.querySelectorAll('#dq input')];
  if(ins.some(x=>x.value.trim()==='')){msg('dm','Preencha a resposta e toque em OK.','info');return;}
  const vals=ins.map(x=>num(x.value));if(vals.some(v=>isNaN(v))){msg('dm','Use só números, com vírgula para os decimais (ex.: 2,5).','info');return;}
  const tol=cur.tol||1e-9;const okk=cur.res.map((r,i)=>Math.abs(r-vals[i])<=tol*Math.max(1,Math.abs(r)));const ok=okk.every(x=>x);
  feito=true;$('ok').disabled=true;placar(ok);ins.forEach((x,i)=>x.style.borderColor=okk[i]?'var(--ok)':'var(--bad)');
  msg('dm',(ok?'Certo! ':'Ainda não. ')+cur.exp,ok?'ok':'bad');};
 $('novo').onclick=novo;novo();}
const box=(c)=>`<input class="n ${c||''}" inputmode="decimal">`;

const NS=[1,2,5,10,20,50,100,200,300,500,1000,1500,2000,2500,3000,5000,7500,10000,15000,20000];
const REF=[[10,'1 cm'],[50,'1 pacote: 5 cm'],[190,'lápis: 19 cm'],[300,'régua: 30 cm'],[750,'mesa: 75 cm'],[1000,'1 metro'],[1600,'Isabelle: 1,60 m'],[2100,'porta: 2,10 m']];
let n=500;
function nice(x){const p=Math.pow(10,Math.floor(Math.log10(x)));for(const m of[1,2,5,10])if(m*p>=x)return m*p;}
function draw(){const h=n*0.1;   // mm
 const top=nice(Math.max(h*1.25,1.2)),Wd=370,H=330,y0=H-24,sc=(H-50)/top,X=165;
 let b=`<line x1="92" y1="${y0}" x2="350" y2="${y0}" stroke="${UM.NAVY}" stroke-width="2"/>`;
 // régua
 const st=nice(top/10)/ (nice(top/10)/top*10>2?2:1);
 b+=`<rect x="64" y="${y0-top*sc}" width="22" height="${top*sc}" fill="#FFF7EF" stroke="${UM.OR}"/>`;
 for(let q=0;q*st<=top+1e-9;q++){const v=Math.round(q*st*1e6)/1e6,y=y0-v*sc;b+=`<line x1="64" y1="${y}" x2="78" y2="${y}" stroke="${UM.OR}"/><text x="58" y="${y+4}" font-size="11" text-anchor="end" fill="${UM.NAVY}" font-family="Poppins,sans-serif">${v>=1000?F(v/1000)+' m':(v>=10?F(v/10)+' cm':F(v)+' mm')}</text>`;}
 // pilha
 const ph=Math.max(h*sc,1);b+=`<rect x="${X}" y="${y0-ph}" width="90" height="${ph}" fill="#F5F8FF" stroke="${UM.NAVY}" stroke-width="1.2"/>`;
 if(n<=60){for(let k=1;k<n;k++){const y=y0-k*0.1*sc;b+=`<line x1="${X}" y1="${y}" x2="${X+90}" y2="${y}" stroke="${UM.BL}" stroke-opacity=".6"/>`;}}
 else{const r=Math.floor(n/500);if(r>=1&&r<=60)for(let k=1;k<=r;k++){const y=y0-k*50*sc;if(k%2)b+=`<rect x="${X}" y="${y}" width="90" height="${50*sc}" fill="#DCE6FF"/>`;}}
 b+=`<text x="${X+45}" y="${y0-ph-6}" font-size="13" font-weight="700" text-anchor="middle" fill="${UM.OR}" font-family="Poppins,sans-serif">${F(n)} folha${n>1?'s':''}</text>`;
 // referências
 REF.filter(r=>r[0]<=top&&r[0]>=top*0.08).forEach(r=>{const y=y0-r[0]*sc;b+=`<line x1="${X-6}" y1="${y}" x2="330" y2="${y}" stroke="${UM.GR}" stroke-dasharray="4 3"/><text x="350" y="${y-4}" font-size="11" text-anchor="end" fill="${UM.GR}" font-family="Poppins,sans-serif">${r[1]}</text>`;});
 $('pf').innerHTML=`<svg viewBox="0 0 ${Wd} ${H}" width="${Math.min(W(),Wd)}">${b}</svg>`;
 $('pr').innerHTML=`${F(n)} × 0,1 mm = <span class="k">${F(h)} mm</span> = ${F(h/10)} cm = ${F(h/1000)} m`+(n%500===0?`<br><span class="g">São ${F(n/500)} pacote${n>500?'s':''} de 500 folhas: ${F(n/500)} × 5 cm.</span>`:'');}
const sl=slider('pn',NS.indexOf(500),0,NS.length-1,i=>{n=NS[i];draw();},i=>F(NS[i]));
function setn(v){n=Math.max(1,Math.min(20000,v));const i=NS.reduce((a,x,j)=>Math.abs(x-n)<Math.abs(NS[a]-n)?j:a,0);sl.set(i);$('pn').querySelector('span').textContent=F(n);draw();}
$('p1').onclick=()=>setn(n+500);$('m1').onclick=()=>setn(n-500);
let ult;
desafio(()=>{ult=gerar1();return ult;});
function gerar1(){const t=rnd(0,2);
 if(t===0){const k=pick([100,200,250,800,1000,1500,2000,3000]);return {html:`Uma pilha com ${F(k)} folhas tem ${box('s')} cm de altura.`,res:[k/100],exp:`${F(k)} × 0,1 mm = ${F(k/10)} mm = ${F(k/100)} cm.`,go:()=>setn(k)};}
 if(t===1){const c=pick([1,2,3,5,10,20,50]);return {html:`Para uma pilha de ${F(c)} cm, são necessárias ${box('s')} folhas.`,res:[c*100],exp:`${F(c)} cm = ${F(c*10)} mm. Cada folha tem 0,1 mm, então cabem 10 folhas em 1 mm: ${F(c*10)} × 10 = ${F(c*100)} folhas.`,go:()=>setn(c*100)};}
 const m=pick([1,2]);return {html:`Para uma pilha de ${F(m)} m, são necessários ${box('s')} pacotes de 500 folhas.`,res:[m*20],exp:`${F(m)} m = ${F(m*100)} cm. Cada pacote tem 5 cm: ${F(m*100)} ÷ 5 = ${F(m*20)} pacotes (${F(m*10000)} folhas).`,go:()=>setn(m*10000)};}
const ok0=$('ok').onclick;$('ok').onclick=()=>{ok0();if($('ok').disabled&&ult)ult.go();};
draw();

</script>
</body>
</html>
