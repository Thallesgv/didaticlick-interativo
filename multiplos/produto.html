<header><div class="brand">Didati<b>Click</b> · Múltiplos e Divisores</div><h1>mmc × mdc = a × b</h1></header>
<main><div class="card"><p class="muted" style="margin-top:0">Escolha dois números. O mdc junta os fatores comuns; o mmc junta um representante de cada fator. Juntos, eles usam exatamente os fatores dos dois números.</p><div class="sl" id="a"><b>a</b><input type="range"><span></span></div><div class="sl" id="b"><b>b</b><input type="range"><span></span></div><div class="fig" id="fig" style="flex-direction:column;align-items:stretch;font-size:15px;color:#0E2354"></div><div class="res" id="rs"></div><div class="nota" id="nt"></div></div></main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>

const f2=v=>fmt(Math.round(v*100)/100);
const T=(x,y,s,o)=>{o=o||{};return `<text x="${x}" y="${y}" font-size="${o.fs||11}" font-weight="${o.w||600}" text-anchor="${o.a||'middle'}" fill="${o.c||'#0E2354'}" font-family="Poppins">${s}</text>`;};
const svg=(W,H,g)=>`<svg viewBox="0 0 ${W} ${H}" width="${W}">${g}</svg>`;


const ehPrimo=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;};
const fat=n=>{const F={};for(let d=2;d*d<=n;d++)while(n%d===0){F[d]=(F[d]||0)+1;n/=d;}if(n>1)F[n]=(F[n]||0)+1;return F;};
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹',sup=e=>String(e).split('').map(c=>SUP[+c]).join('');
const fstr=F=>Object.keys(F).map(p=>F[p]>1?p+sup(F[p]):p).join(' × ')||'1';
const chip=(t,c)=>`<span style="display:inline-block;background:${c||'#F5F7FB'};color:${c?'#fff':'#0E2354'};border-radius:8px;padding:3px 8px;margin:2px;font-weight:700">${t}</span>`;

const A=D.sl('a',2,60,1,+Q.get('a')||24,draw),B=D.sl('b',2,60,1,+Q.get('b')||36,draw);
function draw(){const a=A.get(),b=B.get(),m=gcd(a,b),M=a*b/m,Fa=fat(a),Fb=fat(b);
 const lst=F=>Object.keys(F).flatMap(p=>Array(F[p]).fill(p));
 $('fig').innerHTML=`<div>${a} = ${lst(Fa).map(p=>chip(p,'#2457D6')).join('')}</div><div>${b} = ${lst(Fb).map(p=>chip(p,'#F7821F')).join('')}</div><div>mdc = ${m>1?lst(fat(m)).map(p=>chip(p,'#15803D')).join(''):chip(1)} &nbsp; mmc = ${lst(fat(M)).map(p=>chip(p)).join('')}</div>`;
 $('rs').innerHTML=`<div>mdc<b>${m}</b></div><div>mmc<b>${fmt(M)}</b></div><div>mmc × mdc<b>${fmt(M*m)}</b></div><div>a × b<b>${fmt(a*b)}</b></div>`;
 $('nt').innerHTML=`${fmt(M)} × ${m} = ${fmt(M*m)} e ${a} × ${b} = ${fmt(a*b)}: <b>sempre iguais</b>. Por isso, sabendo o mdc, o mmc sai com uma divisão: ${a} × ${b} ÷ ${m} = ${fmt(M)}.`;}draw();

</script>
