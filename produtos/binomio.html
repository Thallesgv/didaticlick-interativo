<header><div class="brand">Didati<b>Click</b> · Produtos Notáveis</div><h1>Desenvolva (x + k)ⁿ</h1></header>
<main><div class="card"><p class="muted" style="margin-top:0">Escolha k e n. Os coeficientes vêm da linha n do triângulo de Pascal; o expoente de x desce e o de k sobe.</p><div class="sl" id="k"><b>k</b><input type="range"><span></span></div><div class="sl" id="n"><b>n</b><input type="range"><span></span></div><div class="fig" id="pas"></div><div class="dq" id="ct" style="line-height:1.9;font-size:16px"></div></div></main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>

const f2=v=>fmt(Math.round(v*100)/100);
const T=(x,y,s,o)=>{o=o||{};return `<text x="${x}" y="${y}" font-size="${o.fs||11}" font-weight="${o.w||600}" text-anchor="${o.a||'middle'}" fill="${o.c||'#0E2354'}" font-family="Poppins">${s}</text>`;};
const svg=(W,H,g)=>`<svg viewBox="0 0 ${W} ${H}" width="${W}">${g}</svg>`;


const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹',K=D.sl('k',-3,3,1,+Q.get('k')||2,draw),N=D.sl('n',1,6,1,+Q.get('n')||4,draw);
const row=n=>{let r=[1];for(let i=0;i<n;i++)r=[1,...r.slice(1).map((v,j)=>v+r[j]),1];return r;};
function draw(){let k=K.get();if(k===0){K.set(1);k=1;}const n=N.get(),r=row(n);
 $('pas').innerHTML='<div style="text-align:center;font-weight:700;color:#0E2354;line-height:1.7">'+[...Array(n+1).keys()].map(i=>`<div style="${i===n?'color:#F7821F':''}">${row(i).join(' &nbsp; ')}</div>`).join('')+'</div>';
 const xp=e=>e===0?'':e===1?'x':'x'+SUP[e];const terms=r.map((c,j)=>{const v=c*Math.pow(k,j);return [v,xp(n-j)];});
 const sx=terms.map(([v,x],j)=>`${j===0?(v<0?'−':''):(v<0?' − ':' + ')}${Math.abs(v)===1&&x?'':fmt(Math.abs(v))}${x}`).join('');
 $('ct').innerHTML=`(x ${k<0?'−':'+'} ${Math.abs(k)})${SUP[n]} = ${r.map((c,j)=>`${c}·${xp(n-j)||'1'}·(${k<0?'−'+(-k):k})${SUP[j]}`).join(' + ')}<br>= <b>${sx}</b>`;}draw();

</script>
