<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabela periódica interativa · DidatiClick</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../data/elementos.js"></script>
<style>
main{max-width:980px}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.modes button{background:#fff;color:var(--navy);border:2px solid #D7DEEA;font-size:13px;padding:7px 10px}
.modes button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(18,34px);grid-template-rows:repeat(7,38px) 10px repeat(2,38px);gap:2px;width:max-content}
.el{border-radius:4px;border:1px solid rgba(14,35,84,.15);font-size:12px;font-weight:700;color:#0E2354;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:pointer;position:relative;padding:0}
.el small{font-size:7px;font-weight:500;position:absolute;top:2px;left:3px}
.el.sel{outline:3px solid var(--orange);z-index:2}
.el.dim{opacity:.25}
.gap{grid-column:1/-1;height:8px}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:4px}
.leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.ficha .big{display:flex;gap:12px;align-items:center}
.ficha .sym{width:84px;height:84px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;color:#0E2354;flex:0 0 84px}
.ficha .sym b{font-size:30px}
.ficha td{padding:3px 6px}
.arrow{font-size:13px;color:var(--navy);background:var(--peach);border-radius:8px;padding:6px 10px;margin-top:8px}
</style>
</head>
<body>
<header><div class="brand">Didati<b>Click</b> · Química</div><h1>Tabela periódica interativa</h1></header>
<main>
<div class="card">
<div class="modes" id="modes"></div>
<p class="muted" id="hint" style="margin:0 0 6px"></p>
<div class="wrap"><div class="grid" id="grid"></div></div>
<div class="leg" id="leg"></div>
<div class="arrow" id="arrow" hidden></div>
</div>
<div class="card ficha" id="ficha"><p class="muted" style="margin:0">Toque num elemento para ver a ficha dele.</p></div>
</main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
const $=x=>document.getElementById(x);
const MASS=[0,1.0,4.0,6.9,9.0,10.8,12.0,14.0,16.0,19.0,20.2,23.0,24.3,27.0,28.1,31.0,32.1,35.5,39.9,39.1,40.1,45.0,47.9,50.9,52.0,54.9,55.8,58.9,58.7,63.5,65.4,69.7,72.6,74.9,79.0,79.9,83.8,85.5,87.6,88.9,91.2,92.9,96.0,'98',101.1,102.9,106.4,107.9,112.4,114.8,118.7,121.8,127.6,126.9,131.3,132.9,137.3,138.9,140.1,140.9,144.2,'145',150.4,152.0,157.3,158.9,162.5,164.9,167.3,168.9,173.0,175.0,178.5,180.9,183.8,186.2,190.2,192.2,195.1,197.0,200.6,204.4,207.2,209.0,'209','210','222','223','226','227',232.0,231.0,238.0,'237','244','243','247','247','251','252','257','258','259','262','267','268','269','270','269','278','281','282','285','286','289','290','293','294','294'];
const S=(a)=>new Set(a);
const CAT={alc:['Metal alcalino','#F9C38C',S([3,11,19,37,55,87])],alt:['Metal alcalinoterroso','#FBE0A6',S([4,12,20,38,56,88])],
 tra:['Metal de transição','#F6D0C4',S([...range(21,30),...range(39,48),...range(72,80),...range(104,112)])],lan:['Lantanídeo','#E9D5F2',S(range(57,71))],act:['Actinídeo','#D9C8EE',S(range(89,103))],
 out:['Outro metal','#E1E6EE',S([13,31,49,50,81,82,83,84,113,114,115,116])],semi:['Semimetal','#CFE8D6',S([5,14,32,33,51,52,85])],
 hid:['Hidrogênio','#FFFFFF',S([1])],ame:['Ametal','#CFE0FA',S([6,7,8,15,16,34])],hal:['Halogênio','#B8EAF0',S([9,17,35,53,117])],nob:['Gás nobre','#DDF3C8',S([2,10,18,36,54,86,118])]};
function range(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}
const catOf=z=>Object.keys(CAT).find(k=>CAT[k][2].has(z));
const GRUPO={alc:'metal',alt:'metal',tra:'metal',lan:'metal',act:'metal',out:'metal',semi:'semimetal',hid:'hidrogênio',ame:'ametal',hal:'ametal',nob:'gás nobre'};
const GAS=S([1,2,7,8,9,10,17,18,36,54,86]),LIQ=S([35,80]);
// propriedades (elementos representativos; valores aproximados)
const EN={1:2.20,3:.98,4:1.57,5:2.04,6:2.55,7:3.04,8:3.44,9:3.98,11:.93,12:1.31,13:1.61,14:1.90,15:2.19,16:2.58,17:3.16,19:.82,20:1.00,31:1.81,32:2.01,33:2.18,34:2.55,35:2.96,37:.82,38:.95,49:1.78,50:1.96,51:2.05,52:2.10,53:2.66,55:.79,56:.89};
const EI={1:1312,2:2372,3:520,4:900,5:801,6:1086,7:1402,8:1314,9:1681,10:2081,11:496,12:738,13:578,14:787,15:1012,16:1000,17:1251,18:1521,19:419,20:590,31:579,32:762,33:947,34:941,35:1140,36:1351,37:403,38:550,49:558,50:709,51:834,52:869,53:1008,54:1170,55:376,56:503};
const RA={1:25,3:145,4:105,5:85,6:70,7:65,8:60,9:50,11:180,12:150,13:125,14:110,15:100,16:100,17:100,19:220,20:180,31:130,32:125,33:115,34:115,35:115,37:235,38:200,49:155,50:145,51:145,52:140,53:140,55:260,56:215};
const USO={1:'Combustível de foguetes; forma a água.',2:'Balões de festa e dirigíveis (é mais leve que o ar e não pega fogo).',3:'Baterias de celulares e de carros elétricos.',6:'Base de toda a vida; grafite do lápis e diamante.',7:'78% do ar; fertilizantes.',8:'21% do ar; respiração e combustão.',9:'Creme dental (fluoreto) e panelas antiaderentes.',10:'Letreiros luminosos vermelhos.',11:'Sal de cozinha (cloreto de sódio).',12:'Ligas leves (rodas, bicicletas); clorofila das plantas.',13:'Latinhas, panelas, esquadrias.',14:'Chips de computador, painéis solares e vidro (areia).',15:'Palitos de fósforo, fertilizantes e o DNA.',16:'Pólvora, borracha de pneus, ácido sulfúrico.',17:'Tratamento da água e de piscinas.',18:'Lâmpadas e soldagem.',19:'Fertilizantes; presente na banana.',20:'Ossos e dentes; giz, mármore e cimento.',22:'Próteses e aviões (leve e resistente).',24:'Peças cromadas e aço inoxidável.',25:'Aço e pilhas.',26:'Aço (construção, carros); hemoglobina do sangue.',27:'Ímãs e baterias.',28:'Moedas e aço inoxidável.',29:'Fios elétricos e panelas.',30:'Galvanização (protege o ferro da ferrugem) e pilhas.',31:'LEDs e chips.',35:'Remédios e retardantes de chama.',38:'Cor vermelha dos fogos de artifício.',41:'Aço especial para gasodutos e turbinas. O Brasil é o maior produtor do mundo.',47:'Joias, talheres e espelhos.',50:'Solda e folha de flandres (latas).',53:'Sal iodado (previne o bócio) e antissépticos.',54:'Faróis de carros (luz branca forte).',55:'Relógios atômicos. O césio-137 causou o acidente de Goiânia, em 1987.',56:'Exames de raio X do estômago (sulfato de bário).',60:'Ímãs fortes de fones de ouvido, motores e turbinas eólicas.',74:'Filamento das lâmpadas antigas.',78:'Catalisadores de carros e joias.',79:'Joias, eletrônicos e reserva de valor.',80:'Termômetros antigos (é tóxico).',82:'Baterias de carro.',84:'Descoberto por Marie Curie, que lhe deu o nome em homenagem à Polônia.',88:'Descoberto por Marie e Pierre Curie.',92:'Combustível das usinas nucleares (Angra dos Reis).',95:'Detectores de fumaça.'};
const camadas=e=>{const c=[2,8,8,2],o=[];let r=e;for(const x of c){if(r<=0)break;o.push(Math.min(x,r));r-=Math.min(x,r);}return o;};
// ---------- modos ----------
const MODES=[['cat','Categorias'],['tipo','Metal / ametal'],['estado','Estado físico'],['raio','Raio atômico'],['en','Eletronegatividade'],['ei','Energia de ionização'],['origem','Origem']];
let mode=new URLSearchParams(location.search).get('modo')||'cat';if(!MODES.some(m=>m[0]===mode))mode='cat';let sel=null;
$('modes').innerHTML=MODES.map(([k,t])=>`<button data-m="${k}">${t}</button>`).join('');
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw();});
function lerp(a,b,t){return a.map((x,i)=>Math.round(x+(b[i]-x)*t));}
function scale(v,min,max){const t=Math.max(0,Math.min(1,(v-min)/(max-min)));const c=t<.5?lerp([255,247,214],[247,141,51],t*2):lerp([247,141,51],[192,57,43],(t-.5)*2);return `rgb(${c})`;}
const PROP={raio:[RA,20,265,'pm','Raio atômico (pm)','O raio <b>aumenta</b> de cima para baixo (mais camadas) e da direita para a esquerda (núcleo com menos prótons atrai menos os elétrons). Maior: césio. Menor: hidrogênio.'],
 en:[EN,.7,4,'','Eletronegatividade (escala de Pauling)','A eletronegatividade <b>aumenta</b> de baixo para cima e da esquerda para a direita. O flúor é o mais eletronegativo (3,98). Os gases nobres ficam de fora: quase não fazem ligações.'],
 ei:[EI,350,2400,'kJ/mol','Energia de ionização (kJ/mol)','A energia para arrancar um elétron <b>aumenta</b> de baixo para cima e da esquerda para a direita: o oposto do raio. Átomos pequenos seguram mais os elétrons. Maior: hélio. Menor: césio.']};
function color(z,el){const k=catOf(z);
 if(mode==='cat')return CAT[k][1];
 if(mode==='tipo')return {metal:'#F6C9A0',ametal:'#BFD6FA',semimetal:'#CFE8D6','gás nobre':'#DDF3C8','hidrogênio':'#FFFFFF'}[GRUPO[k]];
 if(mode==='estado')return z>103?'#F1F3F7':GAS.has(z)?'#CFE0FA':LIQ.has(z)?'#B8EAF0':'#F6D0C4';
 if(mode==='origem'){const o=window.ELCAT[el[3]];return o?o[1]+'cc':'#eee';}
 const P=PROP[mode];const v=P[0][z];return v===undefined?'#F1F3F7':scale(v,P[1],P[2]);}
function legend(){let h='';
 if(mode==='cat')h=Object.values(CAT).map(c=>`<span><i style="background:${c[1]};border:1px solid #ccd"></i>${c[0]}</span>`).join('');
 else if(mode==='tipo')h=[['Metais','#F6C9A0'],['Ametais','#BFD6FA'],['Semimetais','#CFE8D6'],['Gases nobres','#DDF3C8'],['Hidrogênio','#FFFFFF']].map(([t,c])=>`<span><i style="background:${c};border:1px solid #ccd"></i>${t}</span>`).join('');
 else if(mode==='estado')h=[['Sólido','#F6D0C4'],['Líquido','#B8EAF0'],['Gasoso','#CFE0FA'],['Desconhecido','#F1F3F7']].map(([t,c])=>`<span><i style="background:${c};border:1px solid #ccd"></i>${t} (a 25 °C)</span>`).join('');
 else if(mode==='origem')h=Object.values(window.ELCAT).map(c=>`<span><i style="background:${c[1]}"></i>${c[0]}</span>`).join('');
 else{const P=PROP[mode];h=`<span><i style="background:${scale(P[1],P[1],P[2])};border:1px solid #ccd"></i>menor</span><span><i style="background:${scale((P[1]+P[2])/2,P[1],P[2])}"></i>médio</span><span><i style="background:${scale(P[2],P[1],P[2])}"></i>maior</span><span><i style="background:#F1F3F7;border:1px solid #ccd"></i>sem dado nesta tabela</span>`;}
 $('leg').innerHTML=h;
 const P=PROP[mode];$('arrow').hidden=!P;if(P)$('arrow').innerHTML=P[5];
 $('hint').textContent=mode==='origem'?'Cada cor mostra onde, no Universo, os átomos daquele elemento se formaram.':P?'Valores aproximados, só para os elementos representativos. Toque num elemento para ver o valor.':'Toque num elemento para ver a ficha dele.';}
function draw(){document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
 let h='';
 window.ELEM.forEach(el=>{const [z,s,,,r,c]=el;const row=r<7?r+1:r+1;
  h+=`<button class="el${sel===z?' sel':''}" data-z="${z}" style="grid-row:${r<7?r+1:r+1};grid-column:${c+1};background:${color(z,el)}"><small>${z}</small>${s}</button>`;});
 
 $('grid').innerHTML=h;
 document.querySelectorAll('.el').forEach(b=>b.onclick=()=>{sel=+b.dataset.z;draw();ficha(sel);});
 legend();if(sel)ficha(sel);}
function ficha(z){const el=window.ELEM[z-1],[,s,n,o,r,c]=el,k=catOf(z);
 const per=r<7?r+1:(r===8?6:7);const grupo=r<7?c+1:3;
 const est=z>103?'desconhecido':GAS.has(z)?'gasoso':LIQ.has(z)?'líquido':'sólido';
 const m=typeof MASS[z]==='string'?`[${MASS[z]}] (radioativo; massa do isótopo mais estável)`:String(MASS[z]).replace('.',',')+' u';
 const org=window.ELCAT[o];
 let rows=`<tr><td>Número atômico (Z)</td><td><b>${z}</b></td></tr><tr><td>Massa atômica</td><td>${m}</td></tr>
 <tr><td>Período / grupo</td><td>${per}º período${r<7?` · grupo ${grupo}`:` · série dos ${r===8?'lantanídeos':'actinídeos'}`}</td></tr>
 <tr><td>Classificação</td><td>${CAT[k][0]} (${GRUPO[k]})</td></tr><tr><td>Estado a 25 °C</td><td>${est}</td></tr>`;
 if(z<=20)rows+=`<tr><td>Camadas</td><td>${camadas(z).map((x,i)=>'KLMN'[i]+' = '+x).join(' · ')}</td></tr>`;
 if(RA[z])rows+=`<tr><td>Raio atômico</td><td>≈ ${RA[z]} pm</td></tr>`;
 if(EN[z])rows+=`<tr><td>Eletronegatividade</td><td>${String(EN[z].toFixed(2)).replace('.',',')}</td></tr>`;
 if(EI[z])rows+=`<tr><td>Energia de ionização</td><td>${EI[z]} kJ/mol</td></tr>`;
 if(USO[z])rows+=`<tr><td>No dia a dia</td><td>${USO[z]}</td></tr>`;
 $('ficha').innerHTML=`<div class="big"><div class="sym" style="background:${color(z,el)}"><small>${z}</small><b>${s}</b></div><div><h2 style="margin:0">${n}</h2><div class="muted">${CAT[k][0]}</div></div></div>
 <table style="margin-top:8px">${rows}</table>${org?`<div class="msg info"><b>Origem: ${org[0]}.</b> ${org[2]}</div>`:''}`;}
draw();
</script>
</body>
</html>
