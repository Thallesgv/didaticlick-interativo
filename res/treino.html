<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">

<body>
<header><div class="brand">Didati<b>Click</b> · A Matemática de um Resgate</div><h1>Pratique</h1></header>
<main>

<div class="card"><h2 id="mt">Exercícios sorteados</h2><p class="muted" style="margin-top:0">Cada vez que você aperta <b>Outro exercício</b>, um problema novo é sorteado. Responda, confira e veja a explicação.</p>
<div id="mods" style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px"></div>
<div id="q" style="font-size:17px;line-height:1.5;margin:8px 0"></div>
<div id="resp"></div>
<div class="msg info" id="fb" style="display:none"></div>
<div class="row" style="margin-top:10px"><button id="conf">Conferir</button><button class="alt" id="novo">Outro exercício</button></div>
<p class="muted" id="placar" style="margin-top:10px"></p></div>
</main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
(()=>{
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const LIV={'res1':{T:["A mina em escala", "A rampa: inclinação em %", "Coordenadas em 3D", "Pitágoras no espaço", "O ângulo do furo", "Um grau de erro a 700 m"],G:{1:()=>{const t=R(0,2),E=P([1000,2000,5000,10000,20000]);
 if(t==0){const c=P([2,3,4,5,7,8,12]);return{q:`Na escala <b>1 : ${fmt(E)}</b>, quantos metros valem <b>${c} cm</b> do desenho?`,a:c*E/100,exp:`${c} × ${fmt(E)} = ${fmt(c*E)} cm = ${fmt(c*E/100)} m.`};}
 if(t==1){const m=P([100,200,400,500,700,800]);return{q:`Na escala <b>1 : ${fmt(E)}</b>, quantos centímetros de papel ocupam <b>${m} m</b>?`,a:m*100/E,tol:0.001,exp:`${m} m = ${fmt(m*100)} cm; ${fmt(m*100)} ÷ ${fmt(E)} = ${fmt(m*100/E)} cm.`};}
 const m=P([500,700,1000]),c=P([5,7,10,14]);return{q:`Um desenho mostra <b>${m} m</b> com <b>${c} cm</b>. A escala é 1 : N. Quanto vale N?`,a:m*100/c,tol:0.5,exp:`${m} m = ${fmt(m*100)} cm; ${fmt(m*100)} ÷ ${c} = ${fmt(Math.round(m*100/c))}.`};},
2:()=>{const t=R(0,2);
 if(t==0){const i=P([5,8,10,12,15,20,25]),h=P([100,200,500,1000]);return{q:`Uma rampa avança <b>${h} m</b> na horizontal e desce <b>${h*i/100} m</b>. Qual é a inclinação, em %?`,a:i,exp:`${h*i/100} ÷ ${h} = ${i/100} = ${i}%.`};}
 if(t==1){const i=P([5,7,10,14,20,25]),d=P([350,700,140,280]);return{q:`Quantos metros na horizontal uma rampa de <b>${i}%</b> precisa para descer <b>${d} m</b>?`,a:d/(i/100),tol:0.5,exp:`${d} ÷ ${fmt(i/100)} = ${fmt(Math.round(d/(i/100)))} m.`};}
 const i=P([5,10,20,30,50,100]);return{q:`Uma rampa tem <b>${i}%</b> de inclinação. Qual é o ângulo dela com o chão, em graus? (uma casa decimal)`,a:Math.round(atg(i/100)*10)/10,tol:0.11,exp:`tg θ = ${fmt(i/100)}; θ = tg⁻¹(${fmt(i/100)}) ≈ ${r1(atg(i/100))}°.`};},
3:()=>{const t=R(0,2),a=[R(-5,30)*10,R(-5,30)*10,-R(1,14)*50],b=[R(-5,30)*10,R(-5,30)*10,-R(1,14)*50],k=R(0,2),n=['x','y','z'][k];
 if(t==0)return{q:`Qual é o <b>Δ${n}</b> do deslocamento de A = (${a.join(', ')}) até B = (${b.join(', ')})?`,a:b[k]-a[k],exp:`Δ${n} = ${b[k]} − (${a[k]}) = ${b[k]-a[k]}.`};
 if(t==1)return{q:`Quantos metros o ponto A = (${a.join(', ')}) está <b>abaixo</b> da boca da mina (0, 0, 0)?`,a:-a[2],exp:`z = ${a[2]}: ${-a[2]} m abaixo.`};
 return{q:`Qual é a coordenada <b>${n}</b> do ponto médio entre A = (${a.join(', ')}) e B = (${b.join(', ')})?`,a:(a[k]+b[k])/2,exp:`(${a[k]} + ${b[k]}) ÷ 2 = ${fmt((a[k]+b[k])/2)}.`};},
4:()=>{const t=R(0,2);
 if(t==0){const [p,q]=P([[3,4],[6,8],[5,12],[8,15],[9,12],[7,24]]),k=P([10,20,30]);return{q:`Calcule a distância horizontal h para Δx = <b>${p*k}</b> e Δy = <b>${q*k}</b>.`,a:Math.hypot(p*k,q*k),tol:0.5,exp:`√(${p*k}² + ${q*k}²) = ${fmt(Math.hypot(p*k,q*k))} m.`};}
 if(t==1){const h=P([100,150,200,240,300,400]),z=P([500,600,700,800]);const D=Math.hypot(h,z);return{q:`Distância horizontal <b>${h} m</b> e profundidade <b>${z} m</b>. Quanto mede o furo? (uma casa decimal)`,a:Math.round(D*10)/10,tol:0.11,exp:`√(${h}² + ${z}²) = √${fmt(h*h+z*z)} ≈ ${r1(D)} m.`};}
 const a=R(1,9)*10,b=R(1,9)*10,c=R(1,9)*10;const D=Math.hypot(a,b,c);return{q:`Calcule a distância entre (0, 0, 0) e (${a}, ${b}, −${c}). (uma casa decimal)`,a:Math.round(D*10)/10,tol:0.11,exp:`√(${a}² + ${b}² + ${c}²) = √${fmt(a*a+b*b+c*c)} ≈ ${r1(D)}.`};},
5:()=>{const t=R(0,2);
 if(t==0){const h=P([100,200,300,400]),z=P([500,600,700]);return{q:`Um furo avança <b>${h} m</b> na horizontal e desce <b>${z} m</b>. Qual é o ângulo dele com a <b>vertical</b>? (uma casa decimal)`,a:Math.round(atg(h/z)*10)/10,tol:0.11,exp:`tg θ = ${h} ÷ ${z} ≈ ${fmt(Math.round(h/z*1000)/1000)}; θ ≈ ${r1(atg(h/z))}°.`};}
 if(t==1){const x=R(1,30)*10,y=R(1,30)*10;return{q:`O furo precisa andar Δx = <b>${x}</b> (leste) e Δy = <b>${y}</b> (norte). Qual é o azimute? (uma casa decimal)`,a:Math.round(atg(x/y)*10)/10,tol:0.11,exp:`tg α = ${x} ÷ ${y}; α ≈ ${r1(atg(x/y))}° a partir do norte.`};}
 const L=P([500,600,800,1000]),g=P([10,20,30,40]);return{q:`Um furo de <b>${L} m</b> faz <b>${g}°</b> com a vertical. Quanto ele desce? (uma casa decimal)`,a:Math.round(L*Math.cos(g*RAD)*10)/10,tol:0.11,exp:`${L} × cos ${g}° ≈ ${r1(L*Math.cos(g*RAD))} m.`};},
6:()=>{const t=R(0,2);
 if(t==0){const L=P([100,200,300,500,700,800]),e=P([0.5,1,2,3]);return{q:`Um furo de <b>${L} m</b> desviou <b>${fmt(e)}°</b>. Qual o erro lateral no fundo? (uma casa decimal)`,a:Math.round(L*tg(e)*10)/10,tol:0.11,exp:`${L} × tg ${fmt(e)}° ≈ ${L} × ${fmt(Math.round(tg(e)*10000)/10000)} ≈ ${r1(L*tg(e))} m.`};}
 if(t==1){const w=P([6,8,10,12]),L=P([400,600,700,800]);return{q:`Um alvo de <b>${w} m</b> de largura está a <b>${L} m</b>. Mirando no centro, qual o maior erro de ângulo aceitável, em graus? (duas casas)`,a:Math.round(atg(w/2/L)*100)/100,tol:0.011,exp:`tg(erro) = ${w/2} ÷ ${L}; erro ≈ ${r2(atg(w/2/L))}°.`};}
 const e=P([1,2]),L=P([200,400]),k=P([2,3]);return{q:`Com ${e}° de erro, um furo de ${L} m erra por ${r1(L*tg(e))} m. Se o furo fosse <b>${k} vezes</b> mais comprido, o erro seria quantas vezes maior?`,a:k,exp:`O erro é proporcional ao comprimento: ${k} vezes.`};}}},'res2':{T:["Do que é feito o ar", "O volume do refúgio", "Quanto oxigênio gastamos", "A reta que desce: oxigênio", "A reta que sobe: gás carbônico", "Até quando o ar dura?"],G:{1:()=>{const t=R(0,2);
 if(t==0){const p=P([0.04,0.1,0.5,1,2,3]);return{q:`Quantas <b>ppm</b> correspondem a <b>${fmt(p)}%</b>?`,a:p*10000,exp:`1% = 10.000 ppm; ${fmt(p)} × 10.000 = ${fmt(p*10000)} ppm.`};}
 if(t==1){const v=P([100,500,1000,2000,40000]),g=P([[21,'oxigênio'],[78,'nitrogênio'],[0.04,'gás carbônico']]);return{q:`Quantos m³ de <b>${g[1]}</b> há em <b>${fmt(v)} m³</b> de ar seco (${fmt(g[0])}%)?`,a:v*g[0]/100,tol:0.01,exp:`${fmt(g[0]/100)} × ${fmt(v)} = ${fmt(Math.round(v*g[0])/100)} m³.`};}
 const ppm=P([400,1000,2000,5000,30000]);return{q:`Quanto por cento correspondem a <b>${fmt(ppm)} ppm</b>?`,a:ppm/10000,tol:0.0001,exp:`${fmt(ppm)} ÷ 10.000 = ${fmt(ppm/10000)}%.`};},
2:()=>{const t=R(0,2);
 if(t==0){const c=R(3,10),l=R(2,8),a=R(2,5);return{q:`Qual é o volume, em m³, de uma sala de <b>${c} m × ${l} m × ${a} m</b>?`,a:c*l*a,exp:`${c} × ${l} × ${a} = ${c*l*a} m³.`};}
 if(t==1){const v=P([2,6,12,40,120,250]);return{q:`Quantos <b>litros</b> cabem em <b>${v} m³</b>?`,a:v*1000,exp:`1 m³ = 1.000 L; ${v} × 1.000 = ${fmt(v*1000)} L.`};}
 const w=P([3,4,5]),h=P([3,4]),L=P([100,300,500,1000,2000]);return{q:`Uma galeria tem seção de <b>${w} m × ${h} m</b> e <b>${fmt(L)} m</b> de comprimento. Qual é o volume, em m³?`,a:w*h*L,exp:`Seção: ${w*h} m²; ${w*h} × ${fmt(L)} = ${fmt(w*h*L)} m³.`};},
3:()=>{const t=R(0,2);
 if(t==0){const r=P([10,12,14,15,16,20]),v=P([0.4,0.5,0.6]);return{q:`Uma pessoa respira <b>${r} vezes</b> por minuto, com <b>${fmt(v)} L</b> por respiração. Quantos litros de ar por minuto?`,a:r*v,tol:0.001,exp:`${r} × ${fmt(v)} = ${fmt(Math.round(r*v*100)/100)} L/min.`};}
 if(t==1){const m=P([0.25,0.3,0.5,0.75]);return{q:`Quantos litros de oxigênio uma pessoa gasta em <b>um dia</b>, a <b>${fmt(m)} L/min</b>?`,a:m*1440,tol:0.01,exp:`${fmt(m)} × 60 × 24 = ${fmt(m*1440)} L.`};}
 const n=P([5,10,20,33,40]);return{q:`Cada pessoa gasta 0,36 m³ de oxigênio por dia. Quanto gastam <b>${n} pessoas</b>, em m³ por dia?`,a:Math.round(n*36)/100,tol:0.001,exp:`0,36 × ${n} = ${fmt(Math.round(n*36)/100)} m³/dia.`};},
4:()=>{const t=R(0,2);
 if(t==0){const q=P([0.02,0.03,0.05,0.06]),d=P([5,10,17,20,30]);return{q:`O oxigênio segue p(t) = 21 − ${fmt(q)}t (t em dias). Quanto vale p(${d}), em %?`,a:Math.round((21-q*d)*1000)/1000,tol:0.001,exp:`21 − ${fmt(q)} × ${d} = ${fmt(Math.round((21-q*d)*1000)/1000)}%.`};}
 if(t==1){const q=P([0.02,0.03,0.05,0.06,0.09]);return{q:`Com p(t) = 21 − ${fmt(q)}t, em que dia o oxigênio chega a <b>19,5%</b>? (uma casa decimal)`,a:Math.round(1.5/q*10)/10,tol:0.11,exp:`21 − ${fmt(q)}t = 19,5 → t = 1,5 ÷ ${fmt(q)} ≈ ${r1(1.5/q)} dias.`};}
 const c=P([6,12,18,24,36]),V=P([20000,40000,60000]);return{q:`Consumo de <b>${c} m³</b> de O₂ por dia num ar de <b>${fmt(V)} m³</b>. Quantos pontos percentuais o oxigênio cai por dia? (três casas)`,a:Math.round(100*c/V*1000)/1000,tol:0.0011,exp:`100 × ${c} ÷ ${fmt(V)} = ${fmt(Math.round(100*c/V*1000)/1000)} ponto percentual por dia.`};},
5:()=>{const t=R(0,2);
 if(t==0){const o=P([5,10,12,20,36]);return{q:`Com quociente respiratório 0,8, quantos m³ de CO₂ saem de <b>${o} m³</b> de oxigênio consumido?`,a:o*0.8,tol:0.001,exp:`0,8 × ${o} = ${fmt(Math.round(o*8)/10)} m³.`};}
 if(t==1){const q=P([0.012,0.024,0.048,0.072]),d=P([5,10,17,20]);return{q:`O gás carbônico segue c(t) = 0,04 + ${fmt(q)}t. Quanto vale c(${d}), em %? (três casas)`,a:Math.round((0.04+q*d)*1000)/1000,tol:0.0011,exp:`0,04 + ${fmt(q)} × ${d} = ${fmt(Math.round((0.04+q*d)*1000)/1000)}%.`};}
 const q=P([0.012,0.024,0.046,0.072]);return{q:`Com c(t) = 0,04 + ${fmt(q)}t, em que dia o gás carbônico chega a <b>0,5%</b>? (uma casa decimal)`,a:Math.round(0.46/q*10)/10,tol:0.11,exp:`0,04 + ${fmt(q)}t = 0,5 → t = 0,46 ÷ ${fmt(q)} ≈ ${r1(0.46/q)} dias.`};},
6:()=>{const t=R(0,2);
 if(t==0){const a=R(10,60),b=R(5,40);return{q:`O oxigênio chega ao limite no dia <b>${a}</b> e o gás carbônico no dia <b>${b}</b>. Até que dia o ar dura?`,a:Math.min(a,b),exp:`Vale o primeiro limite: o menor dos dois, dia ${Math.min(a,b)}.`};}
 if(t==1){const k=P([2,3,4]);return{q:`O ar duraria 19,2 dias. Se todos gastarem <b>${k} vezes</b> mais oxigênio, quantos dias dura? (uma casa decimal)`,a:Math.round(19.2/k*10)/10,tol:0.11,exp:`O tempo cai na mesma proporção: 19,2 ÷ ${k} ≈ ${r1(19.2/k)} dias.`};}
 const k=P([2,3,1.5]);return{q:`Com 40.000 m³ o ar dura 19,2 dias. Quantos dias duraria com <b>${fmt(40000*k)} m³</b>? (uma casa decimal)`,a:Math.round(19.2*k*10)/10,tol:0.11,exp:`O tempo é proporcional ao volume: 19,2 × ${fmt(k)} ≈ ${r1(19.2*k)} dias.`};}}}};
const qs=new URLSearchParams(location.search);let l=qs.get('l');if(!LIV[l])l='res1';const {T,G}=LIV[l];
let m=+(qs.get('m'))||1;if(!G[m])m=1;let cur,ok=0,tot=0,feito=false,esc=null;
function mods(){$('mods').innerHTML=T.map((t,i)=>`<button class="${i+1==m?'':'alt'}" style="padding:4px 10px;font-size:13px" title="${t}" data-m="${i+1}">${i+1}</button>`).join('');
 document.querySelectorAll('#mods button').forEach(b=>b.onclick=()=>{m=+b.dataset.m;history.replaceState(null,'','?l='+l+'&m='+m);mods();novo();});}
function novo(){cur=G[m]();feito=false;esc=null;$('mt').textContent='Módulo '+m+' · '+T[m-1];$('q').innerHTML=cur.q;$('fb').style.display='none';
 $('resp').innerHTML=cur.opts?cur.opts.map(o=>`<button class="alt opt" style="margin:3px">${o}</button>`).join(''):'<input type="text" inputmode="decimal" id="r" placeholder="sua resposta" style="font-size:16px;padding:8px;border:2px solid #D7DEEA;border-radius:10px;width:100%;box-sizing:border-box">';
 if(cur.opts)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{esc=b.textContent;document.querySelectorAll('.opt').forEach(x=>x.className='alt opt');b.className='opt';});
 else $('r').onkeydown=e=>{if(e.key=='Enter')conf();};}
function conf(){if(feito)return;let v=cur.opts?esc:($('r').value.trim());if(v===null||v==='')return;
 const certo=cur.opts?v==cur.a:Math.abs(+v.replace(',','.').replace('−','-')-cur.a)<=(cur.tol||0.001);
 feito=true;tot++;if(certo)ok++;$('fb').style.display='block';$('fb').className='msg '+(certo?'ok':'bad');$('fb').innerHTML=(certo?'<b>Certo!</b> ':'<b>Ainda não.</b> A resposta é <b>'+(typeof cur.a=='number'?fmt(cur.a):cur.a)+'</b>. ')+cur.exp;
 $('placar').textContent=`Acertos nesta visita: ${ok} de ${tot}`;}
$('conf').onclick=conf;$('novo').onclick=novo;mods();novo();
})();
</script>
</body>
