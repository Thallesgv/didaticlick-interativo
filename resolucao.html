<body>
<header><div class="brand">Didati<b>Click</b> · Resolução comentada</div><h1 id="title">Resolução</h1></header>
<main>
<div class="card"><h2>Enunciado</h2><p id="enun" style="margin:0"></p></div>
<p class="muted">Tente cada passo antes de abrir o próximo.</p>
<div class="card" id="steps"></div>
<div class="row" style="margin-bottom:16px"><button id="next" class="or">Mostrar próximo passo</button><button id="all" class="alt">Mostrar tudo</button></div>
</main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
const id=new URLSearchParams(location.search).get('id');const R=(window.RES||{})[id];const $=x=>document.getElementById(x);
if(!R){$('title').textContent='Resolução não encontrada';$('next').hidden=$('all').hidden=true;}
else{document.title=R.title+' · DidatiClick';$('title').textContent=R.title;$('enun').innerHTML=R.enun;
 let k=0,open=null;const N=R.steps.length;
 // Cada passo aparece primeiro só com a orientação; a conta/resposta do passo fica escondida até o próximo clique.
 const label=()=>{$('next').textContent=open?'Mostrar resposta do passo':(k<N?'Mostrar próximo passo':'Mostrar resposta final');};
 const see=el=>{if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'nearest'});};
 const reveal=()=>{const el=open;open=null;el.querySelector('.math').hidden=false;el.querySelector('.ask').hidden=true;label();see(el);};
 const finish=()=>{$('next').hidden=$('all').hidden=true;$('steps').insertAdjacentHTML('beforeend',`<div class="msg ok">${R.ans}</div>`);see($('steps').lastElementChild);};
 const step=()=>{const s=R.steps[k++];$('steps').insertAdjacentHTML('beforeend',`<div class="step"><div class="why">${s[0]}</div>${s[1]?`<button type="button" class="ask">Pense no passo… e toque para ver a resposta</button><div class="math" hidden>${s[1]}</div>`:''}</div>`);
  const el=$('steps').lastElementChild;if(s[1]){open=el;el.querySelector('.ask').onclick=()=>{if(open===el)reveal();};}label();see(el);};
 const go=()=>{if(open)reveal();else if(k<N)step();else finish();};
 $('next').onclick=go;$('all').onclick=()=>{while(!$('next').hidden)go();};step();}
</script>
</script>
