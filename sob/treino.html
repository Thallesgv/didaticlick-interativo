<script>
(()=>{

 if(t==0){const a=R(15,80);return{q:`Com o Sol a <b>${a}°</b> de altura, quanto mede o ângulo entre a estaca e o raio de Sol, lá em cima?`,a:90-a,exp:`180° − 90° − ${a}° = ${90-a}°.`};}
 if(t==1){const r=R(30,250)/100,e=P([0.5,1.5,2,2.5,3]);return{q:`Neste momento, a razão sombra ÷ estaca é <b>${fmt(r)}</b>. Qual a sombra de uma vara de <b>${fmt(e)} m</b>? (em metros, duas casas)`,a:Math.round(r*e*100)/100,tol:0.011,exp:`${fmt(e)} × ${fmt(r)} = ${fmt(Math.round(r*e*100)/100)} m.`};}
 const s=R(40,200),e=P([50,80,100,120,150]);return{q:`Uma estaca de <b>${e} cm</b> faz sombra de <b>${s} cm</b>. Qual a razão sombra ÷ estaca? (duas casas)`,a:Math.round(s/e*100)/100,tol:0.011,exp:`${s} ÷ ${e} ≈ ${fmt(Math.round(s/e*100)/100)}.`};},
2:()=>{const t=R(0,2);const H=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
 if(t==0){const md=R(700,770),d=R(60,200);return{q:`Sombras iguais às <b>${H(md-d)}</b> e às <b>${H(md+d)}</b>. Quantos minutos depois das 12h00 é o meio-dia solar? (pode ser negativo)`,a:md-720,exp:`Média: ${H(md)}, ou seja, ${md-720} min em relação às 12h00.`};}
 if(t==1){const m=R(4,40);return{q:`Em <b>${m} minutos</b>, quantos graus a Terra gira?`,a:m/4,tol:0.001,exp:`360° ÷ 1 440 min = 0,25° por minuto: ${m} × 0,25 = ${fmt(m/4)}°.`};}

 if(t==1){const a=R(20,160);return{q:`Qual a medida de cada metade de um ângulo de <b>${a}°</b> dividido pela bissetriz?`,a:a/2,tol:0.001,exp:`${a} ÷ 2 = ${fmt(a/2)}°.`};}

4:()=>{const t=R(0,2);
 if(t==0){const se=P([0.5,0.8,1.25,1.5,2]),h=R(4,40);return{q:`Uma estaca de 1 m faz sombra de <b>${fmt(se)} m</b>. No mesmo instante, uma árvore faz sombra de <b>${fmt(h*se)} m</b>. Qual a altura da árvore, em metros?`,a:h,exp:`${fmt(h*se)} ÷ ${fmt(se)} = ${h} m.`};}

 if(t==0){const d=P([{n:'21 de junho',v:23.4},{n:'21 de dezembro',v:-23.4},{n:'o equinócio de março',v:0}]),la=P([-30,-20,-10,0,10,20,30].filter(x=>Math.abs(x-d.v)>2));const s=d.v>la?'sul':'norte';return{q:`Em <b>${d.n}</b>, o Sol a pino está a ${fmt(d.v)}°. Para onde aponta a sombra do meio-dia de quem está a <b>${Math.abs(la)}° ${la>=0?'N':'S'}</b>?`,opts:['norte','sul'],a:s,exp:`O Sol a pino está ${d.v>la?'ao norte':'ao sul'} do observador; a sombra vai para o lado oposto: ${s}.`};}
 if(t==1){const s=P([[10,0.17],[20,0.34],[30,0.5],[40,0.64]]);const sg=P([1,-1]);return{q:`Que porcentagem da superfície da Terra fica ao sul do paralelo de <b>${s[0]}° ${sg>0?'N':'S'}</b>? (sen ${s[0]}° ≈ ${fmt(s[1])}; arredonde ao inteiro)`,a:Math.round((1+sg*s[1])/2*100),tol:0.6,exp:`(1 ${sg>0?'+':'−'} ${fmt(s[1])}) ÷ 2 ≈ ${Math.round((1+sg*s[1])/2*100)}%.`};}
 return P([{q:'A recíproca de "se A, então B" é:',opts:['se B, então A','se não B, então não A','se não A, então B'],a:'se B, então A',exp:'Troca as partes; não é garantida.'},{q:'Qual é sempre equivalente a "se A, então B"?',opts:['a contrapositiva','a recíproca','nenhuma'],a:'a contrapositiva',exp:'Se não B, então não A.'},{q:'Em julho, sombra do meio-dia para o sul prova que a pessoa está:',opts:['ao sul de ≈ 21,5° N','no hemisfério sul','no Brasil'],a:'ao sul de ≈ 21,5° N',exp:'Só isso: o Sol está ao norte dela.'}]);},
6:()=>{const t=R(0,2);

 if(t==1){const a=R(0,359),b=R(0,359);let d=Math.abs(a-b);if(d>180)d=360-d;return{q:`Qual o ângulo entre os rumos <b>${a}°</b> e <b>${b}°</b>?`,a:d,exp:`Diferença ${Math.abs(a-b)}°${Math.abs(a-b)>180?'; passa de 180°, então 360° − '+Math.abs(a-b)+'° = '+d+'°':''}.`};}
 const N=[['N',0],['NE',45],['E',90],['SE',135],['S',180],['SO',225],['O',270],['NO',315],['ENE',67.5],['SSO',202.5]];const p=P(N);return{q:`Qual o rumo, em graus, da direção <b>${p[0]}</b>?`,a:p[1],tol:0.001,exp:`${p[0]} = ${fmt(p[1])}°.`};}}},'sob2':{T:["Seno, cosseno e tangente", "A altura do Sol", "Por que o Sol muda ao longo do ano", "A curva do ano: função senoidal", "Latitude pelo Sol do meio-dia", "Margem de erro: 1 cm vale quantos km?", "Eratóstenes e o tamanho da Terra"],G:{1:()=>{const t=R(0,2);
 if(t==0){const e=P([100,120,150]),s=R(40,200);const g=Math.round(e/s*1000)/1000;return{q:`Estaca de <b>${e} cm</b>, sombra de <b>${s} cm</b>. Qual a tangente da altura do Sol (estaca ÷ sombra)? (três casas)`,a:g,tol:0.0011,exp:`tg h = ${e} ÷ ${s} ≈ ${fmt(g)}.`};}
 if(t==1){const a=P([3,5,8,7,20]),b={3:4,5:12,8:15,7:24,20:21}[a],c=Math.hypot(a,b);const w=R(0,2),nm=['seno','cosseno','tangente'][w],v=[a/c,b/c,a/b][w];return{q:`Num triângulo retângulo, o cateto oposto ao ângulo α mede <b>${a}</b>, o adjacente <b>${b}</b> e a hipotenusa <b>${c}</b>. Quanto vale o <b>${nm}</b> de α? (três casas)`,a:Math.round(v*1000)/1000,tol:0.0011,exp:`${['oposto ÷ hipotenusa','adjacente ÷ hipotenusa','oposto ÷ adjacente'][w]} = ${[a,b,a][w]} ÷ ${[c,c,b][w]} ≈ ${fmt(Math.round(v*1000)/1000)}.`};}
 const h=P([30,45,60]),tg={30:0.577,45:1,60:1.732}[h],e=P([1,1.5,2]);const s=Math.round(e/tg*100)/100;return{q:`Com o Sol a <b>${h}°</b> (tg ${h}° ≈ ${fmt(tg)}), qual a sombra de uma estaca de <b>${fmt(e)} m</b>? (metros, duas casas)`,a:s,tol:0.011,exp:`sombra = estaca ÷ tg h = ${fmt(e)} ÷ ${fmt(tg)} ≈ ${fmt(s)} m.`};},
2:()=>{const t=R(0,2);
 if(t==0){const s=R(30,180),e=P([100,150]);const h=Math.round(Math.atan(e/s)*180/Math.PI*10)/10;return{q:`Estaca de <b>${e} cm</b>, sombra de <b>${s} cm</b>. Qual a altura do Sol, em graus? (uma casa; use a calculadora: arctg)`,a:h,tol:0.15,exp:`h = arctg(${e} ÷ ${s}) ≈ ${fmt(h)}°.`};}
 if(t==1){const h=R(20,85);return{q:`O fio de prumo do quadrante marca <b>${h}°</b> a partir da borda de mira. Qual a distância zenital do Sol (90° − altura), em graus?`,a:90-h,exp:`z = 90° − ${h}° = ${90-h}°.`};}
 const a=R(50,65),b=a+1,ta=Math.tan(a*Math.PI/180),tb=Math.tan(b*Math.PI/180),x=Math.round((ta+(tb-ta)*R(2,8)/10)*1000)/1000;const h=Math.round((a+(x-ta)/(tb-ta))*10)/10;return{q:`Pela tabela, tg ${a}° ≈ ${fmt(Math.round(ta*1000)/1000)} e tg ${b}° ≈ ${fmt(Math.round(tb*1000)/1000)}. Interpolando, que ângulo tem tangente <b>${fmt(x)}</b>? (uma casa)`,a:h,tol:0.15,exp:`${a}° + (${fmt(x)} − ${fmt(Math.round(ta*1000)/1000)}) ÷ (${fmt(Math.round(tb*1000)/1000)} − ${fmt(Math.round(ta*1000)/1000)}) ≈ ${fmt(h)}°.`};},
3:()=>{const t=R(0,1);
 if(t==0)return P([{q:'Se o eixo da Terra não fosse inclinado, o Sol a pino estaria sempre:',opts:['no equador','no Trópico de Câncer','nos polos'],a:'no equador',exp:'Sem inclinação, a declinação seria sempre 0°.'},{q:'Em 21 de dezembro, o Sol fica a pino sobre:',opts:['o Trópico de Capricórnio','o Trópico de Câncer','o equador'],a:'o Trópico de Capricórnio',exp:'Declinação −23,4°: 23,4° S.'},{q:'As estações existem porque:',opts:['o eixo é inclinado','a Terra se afasta do Sol no inverno','a Lua tapa o Sol'],a:'o eixo é inclinado',exp:'A distância muda pouco; o que muda é a inclinação dos raios.'},{q:'Em julho, o hemisfério que recebe Sol mais a pino é o:',opts:['norte','sul'],a:'norte',exp:'Declinação positiva: Sol a pino ao norte do equador.'}]);
 const la=P([0,10,20,30,40,50]),sg=P([1,-1]);const d=P([23.4,-23.4,0]);const v=Math.round((90-Math.abs(sg*la-d))*10)/10;return{q:`Qual a altura do Sol do meio-dia a <b>${la}° ${sg>0?'N':'S'}</b> quando o Sol a pino está a <b>${d==0?'0°':fmt(Math.abs(d))+'° '+(d>0?'N':'S')}</b>? (uma casa)`,a:v,tol:0.06,exp:`Diferença entre as latitudes: ${fmt(Math.abs(sg*la-d))}°; altura = 90° − ${fmt(Math.abs(sg*la-d))}° = ${fmt(v)}°.`};},
4:()=>{const t=R(0,2);const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],DM=[31,28,31,30,31,30,31,31,30,31,30,31];
 if(t==0){const m=R(0,11),d=R(1,DM[m]);let n=d;for(let i=0;i<m;i++)n+=DM[i];return{q:`Que número do dia do ano (1 a 365) é <b>${d} de ${MS[m]}</b>?`,a:n,exp:`Soma dos meses anteriores + ${d} = ${n}.`};}
 if(t==1){const n=R(1,365);const v=Math.round(23.44*Math.sin(2*Math.PI*(n-80)/365)*10)/10;return{q:`Use δ = 23,44 · sen(360° · (n − 80) ÷ 365). Qual a declinação no dia <b>n = ${n}</b>? (uma casa; negativo = sul)`,a:v,tol:0.15,exp:`360 · (${n} − 80) ÷ 365 ≈ ${fmt(Math.round(360*(n-80)/365*10)/10)}°; 23,44 · sen ≈ ${fmt(v)}°.`};}
 return P([{q:'O período da função δ(n) é de:',opts:['365 dias','180 dias','23,44 dias'],a:'365 dias',exp:'O ciclo se repete a cada ano.'},{q:'A amplitude de δ(n) é:',opts:['23,44°','365°','80°'],a:'23,44°',exp:'Vai de −23,44° a +23,44°.'},{q:'Por que o "− 80" na fórmula?',opts:['a curva passa por zero perto do dia 80 (equinócio de março)','o Sol nasce às 8h','é o número de dias do inverno'],a:'a curva passa por zero perto do dia 80 (equinócio de março)',exp:'Dia 80 ≈ 21 de março.'},{q:'Uma declinação aparece duas vezes por ano porque a senoide:',opts:['sobe e depois desce','é uma reta','só é positiva'],a:'sobe e depois desce',exp:'Cada valor (menos os extremos) é atingido na subida e na descida.'}]);},
5:()=>{const t=R(0,2);
 if(t==0){const d=Math.round((R(-234,234))/10*10)/10,h=R(40,89);const z=90-h;const f=Math.round((d-z)*10)/10;return{q:`Sol <b>ao norte</b> ao meio-dia, a <b>${h}°</b> de altura, com declinação <b>${fmt(d)}°</b>. Qual a latitude? (φ = δ − z; negativo = sul; uma casa)`,a:f,tol:0.06,exp:`z = 90° − ${h}° = ${z}°; φ = ${fmt(d)} − ${z} = ${fmt(f)}°.`};}
 if(t==1){const d=Math.round((R(-234,234))/10*10)/10,h=R(40,89);const z=90-h;const f=Math.round((d+z)*10)/10;return{q:`Sol <b>ao sul</b> ao meio-dia, a <b>${h}°</b> de altura, com declinação <b>${fmt(d)}°</b>. Qual a latitude? (φ = δ + z; negativo = sul; uma casa)`,a:f,tol:0.06,exp:`z = 90° − ${h}° = ${z}°; φ = ${fmt(d)} + ${z} = ${fmt(f)}°.`};}
 const f=R(-30,30);return{q:`Qual a distância, em km, da latitude <b>${Math.abs(f)}° ${f>=0?'N':'S'}</b> até o equador? (1° ≈ 111 km)`,a:Math.abs(f)*111,tol:0.5,exp:`${Math.abs(f)} × 111 = ${Math.abs(f)*111} km.`};},
6:()=>{const t=R(0,2);

 if(t==1){const a=P([0.3,0.4,0.6]),b=P([0.3,0.4,0.8]);const m=Math.round(Math.hypot(a,b)*100)/100;return{q:`Dois erros independentes: <b>± ${fmt(a)}°</b> e <b>± ${fmt(b)}°</b>. Qual a margem total pela raiz da soma dos quadrados? (duas casas)`,a:m,tol:0.011,exp:`√(${fmt(a)}² + ${fmt(b)}²) ≈ ${fmt(m)}°.`};}
 const f=Math.round(R(-200,-50))/10,m=P([0.3,0.5,0.8]);const lo=Math.round((f-m)*10)/10;return{q:`Latitude ${fmt(Math.abs(f))}° S ± ${fmt(m)}°. Qual o valor <b>mais ao sul</b> da faixa, em graus S? (uma casa)`,a:Math.abs(lo),tol:0.06,exp:`${fmt(Math.abs(f))} + ${fmt(m)} = ${fmt(Math.abs(lo))}° S.`};},
7:()=>{const t=R(0,2);
 if(t==0){const a=P([6,7.2,8,9,10,12,15]);return{q:`Que fração da circunferência é um ângulo de <b>${fmt(a)}°</b>? Responda "1 em quantos" (360 ÷ ângulo).`,a:360/a,tol:0.05,exp:`360 ÷ ${fmt(a)} = ${fmt(Math.round(360/a*10)/10)}.`};}
 if(t==1){const a=P([5,6,7.2,8,10]),d=R(5,12)*100;const c=Math.round(d*360/a);return{q:`Duas cidades no mesmo meridiano, a <b>${d} km</b>, e a diferença do ângulo do Sol é <b>${fmt(a)}°</b>. Qual a circunferência da Terra, em km?`,a:c,tol:1,exp:`${d} × 360 ÷ ${fmt(a)} = ${c} km.`};}
 const f=P([0,10,20,30,40,60]),co={0:1,10:0.985,20:0.94,30:0.866,40:0.766,60:0.5}[f];const c=Math.round(40000*co);return{q:`Com a Terra de 40 000 km, qual o comprimento do paralelo de <b>${f}°</b>? (cos ${f}° ≈ ${fmt(co)}; em km)`,a:c,tol:1,exp:`40 000 × ${fmt(co)} = ${c} km.`};}}}};
const qs=new URLSearchParams(location.search);let l=qs.get('l');if(!LIV[l])l='sob1';const {T,G}=LIV[l];
let m=+(qs.get('m'))||1;if(!G[m])m=1;let cur,ok=0,tot=0,feito=false,esc=null;
function mods(){$('mods').innerHTML=T.map((t,i)=>`<button class="${i+1==m?'':'alt'}" style="padding:4px 10px;font-size:13px" title="${t}" data-m="${i+1}">${i+1}</button>`).join('');
 document.querySelectorAll('#mods button').forEach(b=>b.onclick=()=>{m=+b.dataset.m;history.replaceState(null,'','?l='+l+'&m='+m);mods();novo();});}
function novo(){cur=G[m]();feito=false;esc=null;$('mt').textContent='Módulo '+m+' · '+T[m-1];$('q').innerHTML=cur.q;$('fb').style.display='none';
 $('resp').innerHTML=cur.opts?cur.opts.map(o=>`<button class="alt opt" style="margin:3px">${o}</button>`).join(''):'<input type="text" inputmode="decimal" id="r" placeholder="sua resposta" style="font-size:16px;padding:8px;border:2px solid #D7DEEA;border-radius:10px;width:100%;box-sizing:border-box">';
 if(cur.opts)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{esc=b.textContent;document.querySelectorAll('.opt').forEach(x=>x.className='alt opt');b.className='opt';});
 else $('r').onkeydown=e=>{if(e.key=='Enter')conf();};}
function conf(){if(feito)return;let v=cur.opts?esc:($('r').value.trim());if(v===null||v==='')return;
 const certo=cur.opts?v==cur.a:Math.abs(+v.replace(',','.').replace('−','-')-cur.a)<=(cur.tol||0.001);
 feito=true;tot++;if(certo)ok++;$('fb').style.display='block';$('fb').className='msg '+(certo?'ok':'bad');$('fb').innerHTML=(certo?'<b>Certo!</b> ':'<b>Ainda não.</b> A resposta é <b>'+(typeof cur.a=='number'?fmt(cur.a):cur.a)+'</b>. ')+cur.exp;
 $('placar').textContent=`Acertos nesta visita: ${ok} de ${tot}`;}
$('conf').onclick=conf;$('novo').onclick=novo;mods();novo();
})();
