<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pratique · DidatiClick</title>
<link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/fin.css">
<script src="../assets/desafio.js"></script><script src="../assets/fin.js"></script><script src="../assets/ass.js?v=1"></script><script src="../assets/vid.js?v=1"></script>
</head>
<body>
<header><div class="brand">Didati<b>Click</b> · A Matemática da Vida</div><h1>Pratique</h1></header>
<main>

<div class="card"><h2 id="mt">Exercícios sorteados</h2><p class="muted" style="margin-top:0">Cada vez que você aperta <b>Outro exercício</b>, um problema novo é sorteado. Responda, confira e veja a explicação.</p>
<div id="mods" style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px"></div>
<div id="q" style="font-size:17px;line-height:1.5;margin:8px 0"></div>
<div id="resp"></div>
<div class="msg info" id="fb" style="display:none"></div>
<div class="row" style="margin-top:10px"><button id="conf">Conferir</button><button class="alt" id="novo">Outro exercício</button></div>
<p class="muted" id="placar" style="margin-top:10px"></p></div>
</main>
<footer>DidatiClick · Clique e Aprenda · <a href="https://www.instagram.com/didaticlick/" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600;text-decoration:none">@didaticlick</a></footer>
<script>
(()=>{
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const LIV={'vid1':{T:["Do metro ao micrômetro", "Notação científica", "O aumento do microscópio", "Uma vira duas: 2ⁿ", "Área × volume", "Por que as células são pequenas"],G:{1:()=>{const t=R(0,2);
 if(t==0){const v=P([0.2,0.5,0.03,1.5,0.007,0.25]);return{q:`Converta <b>${fmt(v)} mm</b> para micrômetros (µm).`,a:Math.round(v*1000*1000)/1000,exp:`${fmt(v)} × 1.000 = ${fmt(Math.round(v*1000*1000)/1000)} µm.`};}
 if(t==1){const v=P([2,7,25,150,500,80]);return{q:`Converta <b>${v} µm</b> para milímetros.`,a:v/1000,tol:1e-6,exp:`${v} ÷ 1.000 = ${fmt(v/1000)} mm.`};}
 const [n,a]=P([['hemácias de 7 µm',7],['bactérias de 2 µm',2],['células de 20 µm',20],['células de 25 µm',25]]),L=P([1,2,5]);return{q:`Quantas ${n}, enfileiradas, cabem em <b>${L} mm</b>? (arredonde para baixo)`,a:Math.floor(L*1000/a),tol:0.5,exp:`${L} mm = ${L*1000} µm; ${L*1000} ÷ ${a} ≈ ${fmt(Math.floor(L*1000/a))}.`};},
2:()=>{const t=R(0,2);
 if(t==0){const a=R(11,99),e=R(3,12);const v=String(a)+'0'.repeat(e-1);return{q:`Escreva <b>${fmt(Number(v))}</b> como a × 10ⁿ. Quanto vale o expoente n?`,a:e,exp:`${fmt(Number(v))} = ${String(a)[0]},${String(a)[1]} × 10${SUP(e)}.`};}
 if(t==1){const a=R(1,9),e=R(2,9);return{q:`Escreva <b>0,${'0'.repeat(e-1)}${a}</b> em notação científica. Quanto vale o expoente?`,a:-e,exp:`A vírgula anda ${e} casas para a direita: ${a} × 10${SUP(-e)}.`};}
 const a=R(2,9),b=R(2,9),m=R(2,8),n=R(-6,6);const c=a*b;return{q:`Calcule (${a} × 10${SUP(m)}) × (${b} × 10${SUP(n)}) e escreva em notação científica. Qual o expoente?`,a:m+n+(c>=10?1:0),exp:`${a} × ${b} = ${c}; expoentes ${m} + (${n}) = ${m+n}. ${c>=10?'Como '+c+' ≥ 10, ajuste: '+fmt(c/10)+' × 10'+SUP(m+n+1)+'.':'Resultado: '+c+' × 10'+SUP(m+n)+'.'}`};},
3:()=>{const t=R(0,2);
 if(t==0){const o=P([5,10,15]),b=P([4,10,40,100]);return{q:`Ocular de <b>${o}×</b> e objetiva de <b>${b}×</b>. Qual o aumento total?`,a:o*b,exp:`${o} × ${b} = ${o*b}×.`};}
 if(t==1){const s=P([2,5,7,10,20]),m=P([100,400,1000]);return{q:`Uma célula de <b>${s} µm</b> vista com aumento de <b>${m}×</b>. Que tamanho ela parece ter, em mm?`,a:s*m/1000,tol:1e-6,exp:`${s} × ${m} = ${s*m} µm = ${fmt(s*m/1000)} mm.`};}
 const m=P([100,400,500,1000]),r=P([5,7,8,10,20]);return{q:`Com aumento de <b>${m}×</b>, uma célula parece ter <b>${fmt(r*m/1000)} mm</b>. Qual o tamanho real, em µm?`,a:r,exp:`${fmt(r*m/1000)} mm = ${r*m} µm; ${r*m} ÷ ${m} = ${r} µm.`};},
4:()=>{const t=R(0,2);
 if(t==0){const n=R(3,12);return{q:`Calcule <b>2${SUP(n)}</b>.`,a:2**n,exp:`2${SUP(n)} = ${fmt(2**n)}.`};}
 if(t==1){const d=P([10,15,20,30]),h=P([1,2,3]),n0=R(1,5);const n=h*60/d;return{q:`Começando com <b>${n0}</b> bactéria(s) que se dividem a cada <b>${d} min</b>, quantas haverá depois de <b>${h} h</b>?`,a:n0*2**n,exp:`${h*60} ÷ ${d} = ${n} divisões; ${n0} × 2${SUP(n)} = ${fmt(n0*2**n)}.`};}
 const n=R(4,11);return{q:`Quantas divisões são precisas para uma célula virar <b>${fmt(2**n)}</b>?`,a:n,exp:`2${SUP(n)} = ${fmt(2**n)}.`};},
5:()=>{const t=R(0,2),L=R(1,10);
 if(t==0)return{q:`Qual a área da superfície de um cubo de aresta <b>${L} cm</b>, em cm²?`,a:6*L*L,exp:`6 × ${L}² = ${6*L*L} cm².`};
 if(t==1)return{q:`Qual a razão área ÷ volume de um cubo de aresta <b>${L}</b>? (até 2 casas)`,a:Math.round(600/L)/100,tol:0.011,exp:`A/V = 6/L = 6/${L} ≈ ${fmt(Math.round(600/L)/100)}.`};
 const k=R(2,5);return{q:`As medidas de um objeto são multiplicadas por <b>${k}</b>. O volume fica quantas vezes maior?`,a:k**3,exp:`Volume multiplica por k³ = ${k**3} (a área, por k² = ${k*k}).`};},
6:()=>{const t=R(0,2);
 if(t==0){const k=R(2,6);return{q:`A distância até o centro de uma célula fica <b>${k}</b> vezes maior. O tempo de difusão fica quantas vezes maior?`,a:k*k,exp:`Tempo ∝ distância²: ${k}² = ${k*k}.`};}
 if(t==1){const r=P([1,2,3,5,10,15,20,30]);return{q:`Numa esfera, A/V = 3/r. Quanto vale A/V para r = <b>${r} µm</b>? (até 2 casas)`,a:Math.round(300/r)/100,tol:0.011,exp:`3 ÷ ${r} ≈ ${fmt(Math.round(300/r)/100)} por µm.`};}
 const k=R(2,4);return{q:`Duas células esféricas: uma tem raio <b>${k}</b> vezes maior que a outra. Quantas vezes o volume dela é maior?`,a:k**3,exp:`Volume ∝ r³: ${k}³ = ${k**3}.`};}}}};
const qs=new URLSearchParams(location.search);let l=qs.get('l');if(!LIV[l])l='vid1';const {T,G}=LIV[l];
let m=+(qs.get('m'))||1;if(!G[m])m=1;let cur,ok=0,tot=0,feito=false,esc=null;
function mods(){$('mods').innerHTML=T.map((t,i)=>`<button class="${i+1==m?'':'alt'}" style="padding:4px 10px;font-size:13px" title="${t}" data-m="${i+1}">${i+1}</button>`).join('');
 document.querySelectorAll('#mods button').forEach(b=>b.onclick=()=>{m=+b.dataset.m;history.replaceState(null,'','?l='+l+'&m='+m);mods();novo();});}
function novo(){cur=G[m]();feito=false;esc=null;$('mt').textContent='Módulo '+m+' · '+T[m-1];$('q').innerHTML=cur.q;$('fb').style.display='none';
 $('resp').innerHTML=cur.opts?cur.opts.map(o=>`<button class="alt opt" style="margin:3px">${o}</button>`).join(''):'<input type="text" inputmode="decimal" id="r" placeholder="sua resposta" style="font-size:16px;padding:8px;border:2px solid #D7DEEA;border-radius:10px;width:100%;box-sizing:border-box">';
 if(cur.opts)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{esc=b.textContent;document.querySelectorAll('.opt').forEach(x=>x.className='alt opt');b.className='opt';});
 else $('r').onkeydown=e=>{if(e.key=='Enter')conf();};}
function conf(){if(feito)return;let v=cur.opts?esc:($('r').value.trim());if(v===null||v==='')return;
 const certo=cur.opts?v==cur.a:Math.abs(+v.replace(',','.').replace('−','-')-cur.a)<=(cur.tol||0.001);
 feito=true;tot++;if(certo)ok++;$('fb').style.display='block';$('fb').className='msg '+(certo?'ok':'bad');$('fb').innerHTML=(certo?'<b>Certo!</b> ':'<b>Ainda não.</b> A resposta é <b>'+(typeof cur.a=='number'?fmt(cur.a):cur.a)+'</b>. ')+cur.exp;
 $('placar').textContent=`Acertos nesta visita: ${ok} de ${tot}`;}
$('conf').onclick=conf;$('novo').onclick=novo;mods();novo();
})();
</script>
</body>
</html>
